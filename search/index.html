</style></head> <body class="theme-page" data-base="/84000/">  <div id="page" class="view" data-page="search"> <div id="page-content"> <div id="page-bar"><span class="bar-label"><span class="en">search</span><span class="cn">搜尋</span></span><input class="search-input" type="text" autocomplete="off" spellcheck="false"><span class="bar-note hidden" data-empty><span class="en">not found</span><span class="cn">找不到結果</span></span></div> <div id="page-scroll" class> <div id="page-rows" class="rows-col"></div> <div id="page-body">  <script type="application/json" id="work-index">[{"slug":"s001","who":"sw","title_en":"full moon __ past : present : future","title_cn":"明月 ：傳承 / 香港瑰麗酒店 x 香港故宮文化博物館","year":2024,"yearText":"2024","category_en":"packaging","category_cn":"包裝","cats":["packaging"],"cover":"/84000/content/works/s001/00.jpg","imgs":["/84000/content/works/s001/00.jpg","/84000/content/works/s001/01.jpg","/84000/content/works/s001/02.jpg","/84000/content/works/s001/03.jpg"],"client":{"en":"rosewood × hong kong palace museum","cn":"香港瑰麗酒店 × 香港故宮文化博物館"},"hay":"full moon __ past : present : future 明月 ：傳承 / 香港瑰麗酒店 x 香港故宮文化博物館 2024 packaging unlike all mooncake packagings in market, this full moon story is imaginary and inspiring which created by ai with scientific datas.\nit blends transitional and contemporary chinese art and culture.\ndesigner has joined hands with local artist with the world’s first artificial intelligence ink painter a.i. gemini,\nto create a dialogue across time and space and reimagine the harvest moon through ink painting and state-of- the-art technology.\nthe design approach certainly reflects the both rosewood and hong kong palaces museum’s spirit,\nprompting and embracing creative culture with spectrum from traditional to contemporary. 與所有在市場出現之中秋節月餅禮盒設計方向截然不同... 這個副想像力之㘣月故事是由 ai 跟科學數據而創造出來的。\n設計糅合嶄新，並傳承中國文化的精神。平面設計師跟本地視覺藝術家及他的 a.i. gemini ，\n以中國傳統的水墨畫概念，融入古人對中秋滿月的想像及嫦娥四號完成世界首次月球背面軟着陸的相關數據。\n利用由創新的人工智能所輔助的設計及跨越時空的對話，重新詮釋現代水墨畫的傳承。\n這個設計的方向，正正反映香港瑰麗酒店和香港故宮文化博物館雙方的精神，\n推廣和擁抱創意文化在傳統、傳承和未來的探索。"},{"slug":"a001","who":"amm","title_en":"i see ikebana. it is ikebana.","title_cn":"我看花。便是花。","year":2024,"yearText":"2024","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a001/00.jpg","imgs":["/84000/content/works/a001/00.jpg","/84000/content/works/a001/01.jpg","/84000/content/works/a001/02.jpg","/84000/content/works/a001/03.jpg"],"client":null,"hay":"i see ikebana. it is ikebana. 我看花。便是花。 2024 photography i see mountains,\nthey are mountains.\ni see ikebana,\nit is ikebana.\nsee flowers from heart,\nenjoy the flowers.\nfeel home in heart,\nembrace...\nand stay home. 我看山。便是山。\n我看花。便是花。\n心中有花。當下賞花。\n心中有家。安住在家。\ni see ikebana."},{"slug":"x001","who":"xsw","title_en":"the quest for originality / contemporary design\nand traditional craft in dialogue","title_cn":"器惟求新 / 當代設計對話古代工藝","year":2021,"yearText":"2021-2026","category_en":"curation / interior design / exhibition / graphic / film","category_cn":"策展 / 室內設計 / 展覽 / 平面 / 影片","cats":["space","curation","exhibition","art / design"],"cover":"/84000/content/works/x001/00.jpg","imgs":["/84000/content/works/x001/00.jpg","/84000/content/works/x001/01.jpg","/84000/content/works/x001/02.jpg","/84000/content/works/x001/03.jpg"],"client":{"en":"hong kong palace museum","cn":"hong kong palace museum"},"hay":"the quest for originality / contemporary design\nand traditional craft in dialogue 器惟求新 / 當代設計對話古代工藝 2021 curation / interior design / exhibition / graphic / film zone 1 /\nbrief time line introduction of chinese design and craft in history\n(video and craftworks).\n\nzone 2 /\nthe literature of craft and production for empires’s families\n(from different historical periods).\n\nzone 3 /\n6 crafted treasury object series from different materials /\njade / wood craving / glass / enamel /…\neducational details on different materials with samples and tools.\n4 vertical testimonial videos from hong kong artisans,\nexpress their passion on materials,\nand the way they see the industries going forward for next generation.\n\nzone 4 /\nchinese design and craft treasures.\na circular radiation display includes objects of\nclothing / dinning / living / stationary for empires’s families.\n\nzone 5 /\nchinese design spirit /\na long video wall of 4 interviews from hong kong master designers,\nto tell their passion and values in design and creativity\nwithin chinese roots and lead to now and future.\nartistic director stanley wong (anothermountainman) in the last video,\nto conclude the whole show,\nthe importance and meaning to persuade design and craft\nin our own culture from history, and pass on 傳承 to our future,\nalso elaborate the artistic statement\nwhich from the very beginning of the exhibition.\n\nresult /\nhuge positive responses from all stakeholders including\nhong kong public / hong hong kong youngsters / overseas visitors /\nhong kong cultural groups / hong kong and beijing palace museum boards /\nas ex board chairman bernard chan said,\n‘it a unique hong kong story rides on chinese cultural history,\ndemonstrated a pride of hong kong…’ 第一區 /\n中國設計與工藝的歷史簡介\n（影片及工藝品）。\n第二區 /\n歷代皇室的工藝與製作文獻。\n第三區 /\n六個以不同物料製作的珍品系列 /\n玉 / 木雕 / 玻璃 / 琺瑯 /……\n以樣本及工具講解各種物料的知識。\n四段直幅訪談影片，由香港工匠\n細說他們對物料的熱情，\n以及他們眼中行業如何走向下一代。\n第四區 /\n中國設計與工藝珍品。\n環形放射式陳列，包括歷代皇室的\n衣 / 食 / 住 / 文房用品。\n第五區 /\n中國設計精神 /\n一道長影像牆，播放四位香港設計大師的訪談，\n細說他們在中國文化根源上的設計與創作熱情和價值，\n並延伸至當下與未來。\n藝術總監黃炳培（又一山人）於最後一段影片\n為整個展覽作結：\n在自身文化與歷史中追求設計與工藝的重要與意義，\n並將之傳承至未來；\n同時闡述展覽開首的藝術宣言。\n成果 /\n各方持份者反應熱烈正面，包括\n香港市民 / 香港年輕人 / 海外訪客 /\n香港文化團體 / 香港故宮文化博物館及北京故宮博物院董事局；\n正如前董事局主席陳智思所言：\n「這是一個獨特的香港故事，以中國文化歷史為根基，\n展現了香港的驕傲……」"},{"slug":"a002","who":"amm","title_en":"seeing words in hong kong / redwhiteblue //\nwords talking / self talking","title_cn":"香港看字 / 紅白藍 //\n字言。字語","year":2022,"yearText":"2022","category_en":"painting","category_cn":"絲網版畫","cats":["painting"],"cover":"/84000/content/works/a002/00.jpg","imgs":["/84000/content/works/a002/00.jpg","/84000/content/works/a002/01.jpg","/84000/content/works/a002/02.jpg","/84000/content/works/a002/03.jpg"],"client":null,"hay":"seeing words in hong kong / redwhiteblue //\nwords talking / self talking 香港看字 / 紅白藍 //\n字言。字語 2022 painting it is said that “a picture tells more than a thousand words”.\nif a picture can speak more than a thousand words, then,\nwhat can be offered by a picture with just “a few words”?\nwords are used to tell different stories by respective interpretation,\nbeing fermented and polished along with time, the plot becomes more vivid and touching.\nwords can be compelling, but sometimes be taken apart.\nideas can be put into words, but sometimes you have to read between the lines.\nat the crossroad, reminding me of the lyrics of “midnight whisper”\nby cantopop singer sam hui: babbling nonsense, more typos. however, we both know what's in our hearts.\nknowing but not knowing, conversing with myself ruthlessly.\n(a tribute to the heroes and unsung heroes written in the city of hong kong in the past forty years,\ngranting me unlimited imagination and inspiration). 人家説 a picture tells more than a thousand words 。\n如果一幅照片能説多過千言萬語，\n那麼，一張有「三言兩語」的照片，可能給我們什麼...\n文字落在不同人的手中，訴説不同的故事心聲，\n與時間磨合發酵，情節愈發立體、動人。\n有時字字鏗鏘，有時説文會被解字。\n有時白紙黑字，有時唯有字裡行間。\n十字街頭，想起 sam hui 一句歌詞：\n糊言亂語更多錯字，總之兩心知。\n在知還不知當中，好好地、狠狠地，自言自語。\n（ 向四十年來親身看見在香港我城書寫其中的英雄和無名英雄致意，\n賦與我無限想像和靈感。）\nseeing words in hong kong / redwhiteblue //"},{"slug":"s002","who":"sw","title_en":"human interaction /\nart basel hong kong 2021","title_cn":"人際互動 / 香港巴塞爾藝術展","year":2021,"yearText":"2021","category_en":"photography / promotion","category_cn":"攝影 / 宣傳","cats":["photography","advertising"],"cover":"/84000/content/works/s002/00.jpg","imgs":["/84000/content/works/s002/00.jpg","/84000/content/works/s002/01.jpg","/84000/content/works/s002/02.jpg","/84000/content/works/s002/03.jpg"],"client":{"en":"art basel","cn":"香港巴塞爾藝術展"},"hay":"human interaction /\nart basel hong kong 2021 人際互動 / 香港巴塞爾藝術展 2021 photography / promotion during covid 19, hong kong city were almost stopped and people were isolated with health policy for most of daily routine…\ncertainly, art was a meaningful drive to bring people together, again…\na poster / advertisement campaign was captured the key people from art,\ncultural scenes including art lovers, cheerfully blending together,\nto celebrate the special art basel hong kong 2021 episode for a special moment of the city. 在新冠疫情期間，香港幾乎陷入停滯，人們的日常生活大多受到防疫政策的限制…\n藝術無疑是推動人們再次相聚的重要力量…\n一系列海報/廣告宣傳活動捕捉了藝術界和文化界的關鍵人物，\n包括藝術愛好者在內的各界人士歡聚一堂，\n共同慶祝2021年香港巴塞爾藝術展這一特殊時刻，為這座城市增添獨特的色彩。"},{"slug":"x002","who":"xsw","title_en":"life is beautiful","title_cn":"生命是美麗的","year":2016,"yearText":"2016","category_en":"branding / promotion","category_cn":"品牌 / 宣傳片","cats":["advertising","branding","video"],"cover":"/84000/content/works/x002/00.jpg","imgs":["/84000/content/works/x002/00.jpg","/84000/content/works/x002/01.jpg","/84000/content/works/x002/02.jpg","/84000/content/works/x002/03.jpg"],"client":{"en":"ifc development ltd","cn":"ifc development ltd"},"hay":"life is beautiful 生命是美麗的 2016 branding / promotion life is beautiful, savouring the meaning of life.\n\nin our fast-paced society,\nwe sweat everyday between “living a life” and “survival”\nhardly finding the time and mood to savour the meaning of life.\nthere are truly many small things in life that are worthy of savouring.\n\nthe ifc mall is an iconic shopping mall in hong kong.\nit has a human and personal touch,\nbringing together the fine things of our lives,\nwhich are also a part of our lives.\nlet’s start from here with our interpretation of “life is beautiful”.\nlet us explore the meaning of life together. 《生命是美麗的》細味生活的意義。\n今天在步伐急速的社會中，大家每日於「生活」與「生存」之間疲於奔命，\n鮮有心思時間細味生活的意義，感受人生。\n事實上，生活當中種種的細節，都值得大家細心欣賞。\nifc商場是本港具代表性的商場之一，具有親和力及人性化的一面，\n匯聚大家的生活點滴，亦是大家生活的一部分。\n正好以此出發，演繹「生命是美麗的」，與大眾正面探討生命。"},{"slug":"a003","who":"amm","title_en":"hong kong walk on / one","title_cn":"香港前行","year":2022,"yearText":"2022","category_en":"installation / product / photography","category_cn":"裝置 / 產品 / 攝影","cats":["installation","product","photography"],"cover":"/84000/content/works/a003/00.jpg","imgs":["/84000/content/works/a003/00.jpg","/84000/content/works/a003/01.jpg","/84000/content/works/a003/02.jpg","/84000/content/works/a003/03.jpg"],"client":null,"hay":"hong kong walk on / one 香港前行 2022 installation / product / photography for everything in life\nthere is no\nclear start point\nand there will be\nno absolute ending\nit’s a journey of\nstraight and winding\nsmooth and rugged\nsame for everything\nsame for our city hong kong\nanothermountainman\npalms together 裝飾\n人生\n就像一個圓圈\n沒有一個清楚的起點\n亦沒有絕對的終點\n路途上\n有直有彎\n有平坦\n也有崎嶇\n凡事也許如是\n我城香港如是\n又一山人 合十"},{"slug":"x003","who":"xsw","title_en":"redwhiteblue 330","title_cn":"紅白藍330","year":2011,"yearText":"2011","category_en":"branding / curation / product / graphic","category_cn":"品牌設計 / 策展 / 產品 / 平面設計","cats":["branding","curation","product","art / design"],"cover":"/84000/content/works/x003/00.jpg","imgs":["/84000/content/works/x003/00.jpg","/84000/content/works/x003/01.jpg","/84000/content/works/x003/02.jpg","/84000/content/works/x003/03.jpg"],"client":{"en":"new life psychiatric rehabilitation association","cn":"new life psychiatric rehabilitation association"},"hay":"redwhiteblue 330 紅白藍330 2011 branding / curation / product / graphic positive hongkong, redwhiteblue\nredwhiteblue is existence, participation,\ndedication and giving.\nredwhiteblue is perseverance, diligence and endurance\nredwhiteblue represents each and every hong kong people of the 1960s and 1970s\nafter the handover, 50 years unchanged....\npositive, motivated\nanothermountainman\n\nredwhiteblue  body  heart  soul\ntough and dependable, but flexible and adaptable.\nthe redwhiteblue series not only symbolise the perseverance,\nflexibility and diligence of the hong kong people,\nit also represents the hard work\nthat the rehabilitated patients of mental illness\ngave in making these fabric products,\nit is an important first step in achieving self-recovery\nand rebuilding the health of the “body  heart  soul”\nnew life association 正面香港 紅白藍\n紅白藍是存在、參與、耕耘和付出\n紅白藍是堅持、拼博、和捱苦\n紅白藍是代表我們香港六、七十年代的\t每一份子\n這是我們香港回歸後\n應一直保持五十年不變的…\n正面積極\n又一山人\n紅白藍 身 心 靈\n堅韌可靠，卻又靈活多變的\n紅白藍系列不僅象徵着香港人堅毅不屈、\n靈活變通的拼博精神，它亦代表着\n精神病康復者為製作出\n精心布藝產品而付出的不懈努力，\n為自我復元、重建健康之「身 心 靈」\n踏出重要的一步\n新生會"},{"slug":"s003","who":"sw","title_en":"hmv ideal","title_cn":"","year":2008,"yearText":"2008","category_en":"branding / interior / graphic","category_cn":"品牌 / 室內 / 平面","cats":["branding","space","art / design"],"cover":"/84000/content/works/s003/00.jpg","imgs":["/84000/content/works/s003/00.jpg","/84000/content/works/s003/01.jpg","/84000/content/works/s003/02.jpg","/84000/content/works/s003/03.jpg"],"client":{"en":"hmv","cn":"hmv"},"hay":"hmv ideal 2008 branding / interior / graphic"},{"slug":"s004","who":"sw","title_en":"heaven & hell /\nagi / hong kong conference","title_cn":"天堂與地獄 / 國際平面設計聯盟 / 香港會議","year":2012,"yearText":"2012","category_en":"event visual / promotion / book / poster","category_cn":"活動視覺 / 書籍 / 海報 / 推廣","cats":["advertising","exhibition","book","poster"],"cover":"/84000/content/works/s004/00.jpg","imgs":["/84000/content/works/s004/00.jpg","/84000/content/works/s004/01.jpg","/84000/content/works/s004/02.jpg","/84000/content/works/s004/03.jpg"],"client":{"en":"agi alliance graphique internationale","cn":"國際平面設計聯盟（agi）"},"hay":"heaven & hell /\nagi / hong kong conference 天堂與地獄 / 國際平面設計聯盟 / 香港會議 2012 event visual / promotion / book / poster “heaven and hell” is the theme of the agi 2012 held during the hong kong design conference and exhibition.\nheaven and hell are relative,\nthere is always bad in good, and good in bad.\nit is heaven and it is hell.\na long time ago, hong kong was a “shopping paradise” and then it also became a “gourmet paradise”.\nheaven is perfection, is a dream,\na pursuit, an epitome...\na common line in movies – “there is a road to heaven but you shun it, there is no door to hell yet you break in…”\nor, another oft-heard line,\n“if i do not risk going to hell, no one will.”\nheaven and hell exist in the mythical world.\nheaven and hell exist in the religious world.\nthere is heaven and hell in the west.\nthere is heaven and hell in the east.\nif hell is in the abyss between the east and the west,\nthen,\nheaven should be up high,\ncloser to the sky…\nin the buddhist world,\nthere are also two states of existence:\npurified land (heaven) exists among us,\nright before us, in our minds,\nand so does hell.\none thought can take us to heaven,\nanother thought can bring us hell. 《天堂與地獄》是agi 二○一二在香港舉辦設計會議及活動的主題。\n天堂與地獄是一個相對的，好中有壞，壞中有好的概念。\n也是地獄。也是天堂。\n很久很久以前，\n香港被譽為「購物天堂」\n後又被稱「美食天堂」。\n天堂是美好至極，是夢，是追求，\n是指標…\n電影常出現這句話：「天堂有路你不走，地獄無門你闖進來…」\n另外一句：「我不入地獄，誰入地獄。」\n神話世界有天堂地獄。\n宗教世界有天堂地獄。\n西方有天堂地獄。\n東方有天堂地獄。\n如果地獄是在東西方之間地底最深處，\n那麼，\n天堂是較近哪一方之天空上面…\n佛的世界也有另兩角度：\n淨土（天堂）就在人間，\n地獄也在眼前。\n一念天堂，一念地獄。"},{"slug":"a004","who":"amm","title_en":"heaven on earth","title_cn":"凡非凡","year":2012,"yearText":"2007 / 2009 / 2012","category_en":"photography","category_cn":"photography","cats":["photography"],"cover":"/84000/content/works/a004/00.jpg","imgs":["/84000/content/works/a004/00.jpg","/84000/content/works/a004/01.jpg","/84000/content/works/a004/02.jpg","/84000/content/works/a004/03.jpg"],"client":null,"hay":"heaven on earth 凡非凡 2012 photography he sees, mirage.\nshe sees, oasis.\ni see, heaven on earth. 他看。海市蜃樓\n你看。汪洋綠洲\n我看。人間淨土"},{"slug":"x004","who":"xsw","title_en":"a bowl of life","title_cn":"一碗生命","year":2011,"yearText":"2011","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/x004/00.jpg","imgs":["/84000/content/works/x004/00.jpg","/84000/content/works/x004/01.jpg","/84000/content/works/x004/02.jpg","/84000/content/works/x004/03.jpg"],"client":null,"hay":"a bowl of life 一碗生命 2011 photography to have a bowl of rice, life is nurtured.\nto take a bowl of tea, body and soul are enlivened.\n\nto inside from outside.\nfrom inside to outside.\nback and forth.\ngive and take.\n\nthose inside a bowl,\ncan be consumed,\ncan nurture a life.\n\na family of three is a family.\nthree generations under the same roof also form a family.\nheaven and earth, with all beings, are ultimately the same family.\n\ntogether we form a true family. 吃一碗飯 生命得以持續\n吃一碗茶 身心靈為之飛揚\n往內 從外\n從內 往外\n有來 有往\n有受 有施\n碗裡頭的\n可往肚裡吃\n可以栽出生命\n一家三口是家\n三代同堂是家\n大地眾生萬物正是家\n大家 才是家\n又一山人/ 概念/ 攝影\n暨\n餘德麗/ 綠色碗景"},{"slug":"x005","who":"xsw","title_en":"fang suo commune","title_cn":"定是常住。便成方所","year":2011,"yearText":"2011-now","category_en":"branding / consultant / interior design / exhibition / graphic","category_cn":"品牌設計 / 顧問 / 室內設計 / 展覽 / 平面設計","cats":["branding","space","exhibition","art / design"],"cover":"/84000/content/works/x005/00.jpg","imgs":["/84000/content/works/x005/00.jpg","/84000/content/works/x005/01.jpg","/84000/content/works/x005/02.png","/84000/content/works/x005/03.jpg"],"client":{"en":"fang suo commune","cn":"fang suo commune"},"hay":"fang suo commune 定是常住。便成方所 2011 branding / consultant / interior design / exhibition / graphic fangsuo is not just a bookstore. nor is it an area.\nit is an attitude, an advocate.\nit is an attempt to boldly amplify aesthetics in everyday life.\n\nin the vast, boundless space of the universe,\nwe encounter the wisdom and knowledge of old and new,\nwe meet with designers from far and wide,\nwe connect with our own hearts and minds.\n\nfangsuo is a peaceful and quiet spot in the universe,\nit’s now.\nlet us all gather here.\nfangsuo, a community that began in china,\nis a platform for culture and aesthetics to meet,\na space where sensuality and intellect reside,\na conjugation of knowledge, aesthetics and living.\n\nin this wide expanse for nurturing and practice,\npeople pursue truth, feel beauty,\nexperience the power that peace and tranquillity bring. 方所不僅是書店  方所不僅是方所\n方所是一種態度  一個主張\n一個將美學在生活中放大化的嘗試\n十方世界廣闊無限的宇宙中\n我們與古往今來的知識相遇\n我們與設計師的作品相遇\n我們與所有遊方世界的旅人相遇\n我們與我們的心相遇\n方所是宇宙寧靜的一點  是當下\n讓我們在此相遇\n方所是一個源於中國的場所\n一個文化與美學匯聚的平台\n一個讓知性與感性得以寄託的空間\n一種知識  審美與生活的結合\n人們在這共修之地\n追求真  感受美\n體會當人心安放時  寧靜即力量"},{"slug":"a005","who":"amm","title_en":"impermanent","title_cn":"無常","year":2009,"yearText":"2009","category_en":"installation / furniture","category_cn":"裝置 / 傢俱","cats":["installation"],"cover":"/84000/content/works/a005/00.jpg","imgs":["/84000/content/works/a005/00.jpg","/84000/content/works/a005/01.jpg","/84000/content/works/a005/02.jpg","/84000/content/works/a005/03.jpg"],"client":null,"hay":"impermanent 無常 2009 installation / furniture the rise of causes is simply because of one’s subjectivity and wishful thinking.\nmore than ten years ago, i had a conversation with my friends about the forms of funeral\nand how to see people for the last time.\ni expressed my concerns: the melancholy, the hazy and smoky environment and\nthe colors in traditional chinese-style funeral were things i found uncomfortable…\nwe opened the end of the conversations.\nthe most concerns of all, in my thinking, was about coffin.\n1. it was environmental unfriendly. even the state-of-the-art eco-coffin was after all one kind of\ncommodities which came into being thanks to “death”, it was a luxury item for its one-time usage.\n2. its over-design and the curvy outlook annoyed me for i am a perfectionist\nin pursuing straight lines and the orderly square shape.\n(that was before a relatively more minimal design of paper coffin was brought out in the market.)\n3. most of all, the alienation. i asked myself for what reasons people have to be wrapped,\nin their very last moment,in an object or space that makes no connection to their lives and carries no emotions?\nas i thought about all these, i decided to make a sofa bed for my own use\nfor up to 30 or 50 years until i passed away in it.\nhow environmental friendly it is, and how intimate it is to me…\nas i thought more deeply, i knew that by interacting intimately with the sofa bed everyday\ni could experience how “death” is regarded as part of one’s life.\nit would be a task and learning for me to come face-to-face with my own life.\nimpermanent. between a sofa bed and a coffin.\nimpermanent. between this life, death and the next life.\nin between. there should be the will to cherish… it should be positive… proactive… and free…\nimpermanent. the experiencing the life. 緣起，只因主觀願望，只因一廂情願 ⋯\n十多年前與朋友説起葬禮的形式，如何與他人見最後一面。\n表白了我關心的是：怕悲情、怕香燭煙火、怕傳統中式葬禮的多顏色⋯⋯\n開了話題，拜託了朋友，往後再看吧。\n再想下去，最不安的要算是棺木這環節吧。\n接受不了它不夠環保，就算是近年面世的環保棺材，\n也是因死而「生」的市場產品；\n只可使用一次的奢侈產品。\n接受不了它不夠簡約和多弧線外型的設計﹝當時還未出現紙棺材這比較簡約的造型﹞，\n正因為一向自知是個對直線、四正追求「完美」主義者。\n最最接受不了的是陌生感受。心裡問：為何在離世的最後一刻、伴著的空間，\n竟是被那個與一生無關、沒時日感情、沒感覺的東西包圍著。\n想了想了，決定做張梳化牀，用它三、五十年，然後裹身一同離去。\n符合環保原則，多麼親切，多好 ⋯⋯\n再想，藉著每天親近梳化牀的互動，親身感受「死」是人生的一部份這概念；\n親近面對自己人生的一個功課。\n無常。是梳化牀和棺木之間。\n無常。是今生和死亡和來生之間。\n之間。應該是珍惜⋯是正面⋯是積極⋯是自在⋯\n無常。是體驗人生。"},{"slug":"s005","who":"sw","title_en":"red light / wheel","title_cn":"紅燈 / 車轆","year":1991,"yearText":"1991","category_en":"tv commercial / poster","category_cn":"電視廣告 / 海報","cats":["poster","tv commercial"],"cover":"/84000/content/works/s005/00.jpg","imgs":["/84000/content/works/s005/00.jpg","/84000/content/works/s005/01.jpg","/84000/content/works/s005/02.jpg","/84000/content/works/s005/03.jpg"],"client":{"en":"mtr mass transit railway corporation","cn":"地下鐵路公司"},"hay":"red light / wheel 紅燈 / 車轆 1991 tv commercial / poster i thank willde ng and gary chui for bringing me into the family of j. walter thompson and the mtr advertising creative team. since there were seven million readers and audience, i quickly adopted the essence of the “local” life as the start point for the creative – a rarity in advertising back then.\nthat four and a half years of experience allowed me to fully appreciate the local culture, people... reshaping my views and values of my creative work and life.\nthis is the project that brought me fame within the asian creative circle.\nthis brought me the first award in my career in advertising world.\nthis might be the most effective communication work throughout my career.\nthis tvc series might be the project with the lowest production cost in hong kong advertising scene. 感謝吳文芳和徐憶雄帶我進入智威湯遜這大家庭，成為地下鐵路廣告創意團隊。\n因七百萬人都是讀者和觀眾，\n令我很快進入以「地道」生活元素出發作為創意溝通的切入點，\n這也是當年少見的廣告語言。\n這四年半的經驗，\n讓我切切實實落實到地道、人文種種，\n改變我往後創作和做人的思路和價值觀。\n這是令我在亞洲創意圈建立名聲的項目。\n這是商業創作生涯得獎零的突破。\n這可能是我工作以來，最有效的宣傳案子。\n這電視廣告系列可能是香港廣告製作最低成本的其中一個。"},{"slug":"s006","who":"sw","title_en":"contemporary hong kong poet series","title_cn":"當代香港詩人系列","year":2019,"yearText":"2019","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s006/00.jpg","imgs":["/84000/content/works/s006/00.jpg","/84000/content/works/s006/01.jpg","/84000/content/works/s006/02.jpg","/84000/content/works/s006/03.jpg"],"client":null,"hay":"contemporary hong kong poet series 當代香港詩人系列 2019 book"},{"slug":"x006","who":"xsw","title_en":"luoluo suosuo: what anothermountainman thought of, written, said and heard of in 60 years","title_cn":"囉囉唆唆——又一山人六十年想過寫過說過聽過的","year":2019,"yearText":"2019","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/x006/00.jpg","imgs":["/84000/content/works/x006/00.jpg","/84000/content/works/x006/01.jpg","/84000/content/works/x006/02.jpg","/84000/content/works/x006/03.jpg"],"client":null,"hay":"luoluo suosuo: what anothermountainman thought of, written, said and heard of in 60 years 囉囉唆唆——又一山人六十年想過寫過說過聽過的 2019 book “i have four futures: one right before my eyes that i can grasp, one i believe by heart yet far away from now, one after life comes to an end, and one more with great importance, is the future that i can work on when i wake up in the morning.”\n\n– anothermountainman\n\nturning 60, anothermountainman has worked for 40 years.\n\nthings he has thought of, written, heard of, said and did in all these years, are not something that can be easily conclude or make an abstract of. this book includes his own words, what people said about him, what he finds inspiring, as well as his response to others. there are writings, aphorisms, creations, interviews, excerpts etc., which add up to almost 100,000 words, exploring ways to work towards the goal of achieving harmony.\n\nno matter it is stanley wong or anothermountainman, or a crossover of the two identities, he has lived a fruitful life through gaining experiences and mind precipitations.\n\nsixty years may only represent a certain point in time, but at this moment, when we reflect on the past, it is more a new beginning to welcome the unknown future. 「我有四個未來：眼前能掌握前行的未來。心中相信而極遙遠的未來。生命告一段落後的未來。還有一個很重要的，明早起來能執行的未來。」\n\n– 又一山人\n\n又一山人活了一圈甲子，工作了四十個年頭。\n\n在這些年月間，他想過、寫過、聽過、說過、做過……的，並不是隻言片語可以概括論述。本書有他自說自話，有他人說他，有受他人啟發，也有回應他人的；近十萬字，當中有文字、警句、創作、訪談、節錄等穿梭交織，乃朝著「人的和諧」的理想去探討和實踐。\n\n無論是stanley wong、又一山人，或又一山人 x stanley wong的身份交疊，也是以自身經驗的積累與沉澱，走出豐盛的人生旅程。\n\n六十年，只是時間的段落點，在檢視過去的當下，更是迎接未知將來的新的開始。"},{"slug":"a006","who":"amm","title_en":"ynot/t","title_cn":"十二件練功T","year":2017,"yearText":"2017","category_en":"object","category_cn":"物件","cats":["object"],"cover":"/84000/content/works/a006/00.jpg","imgs":["/84000/content/works/a006/00.jpg","/84000/content/works/a006/01.jpg","/84000/content/works/a006/02.jpg","/84000/content/works/a006/03.jpg"],"client":null,"hay":"ynot/t 十二件練功t 2017 object this is not worn to attract attention\n\nit is not something to make me look smarter, more handsome\n\nit is not a slogan tee i use to make a statement\n\nit serves as a reminder\n\nit is something for me to learn, to practice\n\nput on ynot/t\n\nstand in this unpredictable distorted world\n\nthen whisper to your inner self\n\nthis is me\n\nsurvive + live + life\n\nexperience all in one goal\n\nwhy not 山人：物：語\n\n這不是一件穿給人家看的衣服\n\n這不是一件令自己更帥更美的衣服\n\n這不是一件表態的slogan tee\n\n這是一件給自己提示的衣服\n\n這是一件給自己練功和修行的衣服\n\n穿上ynot/t\n\n站在這不斷變幻傾側的世界國度\n\n向心裡的自己交代一句\n\n這是我\n\n生存+生活+生命\n\n三生一世\n\nwhy not"},{"slug":"x007","who":"xsw","title_en":"being hong kong","title_cn":"就係香港","year":2018,"yearText":"2018","category_en":"mixed media / book","category_cn":"跨媒體 / 書籍","cats":["media","book"],"cover":"/84000/content/works/x007/00.jpg","imgs":["/84000/content/works/x007/00.jpg","/84000/content/works/x007/01.jpg","/84000/content/works/x007/02.jpg","/84000/content/works/x007/03.jpg"],"client":null,"hay":"being hong kong 就係香港 2018 mixed media / book being hong kong is a quarterly magazine that explores and tells local stories of hong kong, and at the same time re-affirms the power of text and writing. from conception, text review, image editing, typesetting, paper testing to printing, the publishing team experiments on creative combinations of content, visual effect and texture, so as to create unique reading experience to readers.\n\nthe “being” media team is comprised of dedicated members from media, publishing, design creative, culture, art and marketing fields. all born and raised in hong kong, they join hands to discover stories of their hometown and its people. through different formats and channels, our love and hope towards the city truly revealed. 「就係媒體」由一群來自傳媒、出版、設計創意、文化、藝術及市場推廣各個界別的工作者組成。通過各種形式與想像，說香港與香港人的故事。\n\n一路走過來，在香港出生、成長，我們經歷了這個地方的繁榮，歲月令我們更清楚自己的信念。\n\n我們仍然對人對生活充滿好奇，我們對香港仍充滿期盼和希望。通過being hk「就係香港」季刊紙本為核心，並輔以網絡平台及實體活動，發掘未完的香港故事。"},{"slug":"a007","who":"amm","title_en":"dance goes on","title_cn":"冇照跳","year":2017,"yearText":"2017","category_en":"multimedia","category_cn":"多媒體","cats":["video","media"],"cover":"/84000/content/works/a007/00.jpg","imgs":["/84000/content/works/a007/00.jpg","/84000/content/works/a007/01.jpg","/84000/content/works/a007/02.jpg","/84000/content/works/a007/03.jpg"],"client":null,"hay":"dance goes on 冇照跳 2017 multimedia a long-planned dance movie project, a dance experimentation project without a stage, audience or format boundaries, initiated by stanley wong (anothermountainman) and three of his good friends: mui cheuk-yin, xing liang and yuri ng, all accomplished choreographers.\n\nthe three friends choreographed improvised “personal – exceptional” dances with the people, space and objects of hong kong, drawing on the essence of dance and the many issues surrounding our home, hong kong, the city we live in. their wish is for hong kong to stride forward and dance with its usual embracing and positive attitude; a wish for hong kong, “life goes on…” 一個經長期醞釀的舞蹈電影計劃，由黃炳培（又一山人）連結三位舞蹈界的達人好友：梅卓燕、邢亮及伍宇烈，一起進行沒有舞台、沒有觀眾、不設形式界限的舞蹈實驗。\n\n三人在電影中分別創作「非常」自身的舞蹈，重新探索香港的人、地、物，重新發現舞蹈的本質，以及自處今天香港這個城市的種種。期盼這城市能如昔以豁達包容，正面態度往前走，往前舞動；並寄語香港：life goes on…"},{"slug":"s007","who":"sw","title_en":"hong kong belt road city to city cultural exchange conference 2017","title_cn":"香港帶路 城市對城市 文化交流會議 2017","year":2017,"yearText":"2017","category_en":"branding","category_cn":"品牌","cats":["branding"],"cover":"/84000/content/works/s007/00.jpg","imgs":["/84000/content/works/s007/00.jpg","/84000/content/works/s007/01.jpg","/84000/content/works/s007/02.jpg","/84000/content/works/s007/03.jpg"],"client":null,"hay":"hong kong belt road city to city cultural exchange conference 2017 香港帶路 城市對城市 文化交流會議 2017 2017 branding"},{"slug":"a008","who":"amm","title_en":"hatred","title_cn":"","year":2017,"yearText":"2017","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a008/00.jpg","imgs":["/84000/content/works/a008/00.jpg","/84000/content/works/a008/01.jpg","/84000/content/works/a008/02.jpg","/84000/content/works/a008/03.jpg"],"client":null,"hay":"hatred 2017 poster"},{"slug":"s008","who":"sw","title_en":"thin as air","title_cn":"薄如空氣","year":2017,"yearText":"2017","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s008/00.jpg","imgs":["/84000/content/works/s008/00.jpg","/84000/content/works/s008/01.jpg","/84000/content/works/s008/02.jpg","/84000/content/works/s008/03.jpg"],"client":null,"hay":"thin as air 薄如空氣 2017 book"},{"slug":"x008","who":"xsw","title_en":"together and happy","title_cn":"大家樂","year":2017,"yearText":"2017","category_en":"advertising / branding / mixed media / packaging / photography","category_cn":"廣告 / 品牌 / 跨媒體 / 包裝 / 攝影","cats":["advertising","branding","media","packaging","photography"],"cover":"/84000/content/works/x008/00.jpg","imgs":["/84000/content/works/x008/00.jpg","/84000/content/works/x008/01.jpg","/84000/content/works/x008/02.jpg","/84000/content/works/x008/03.jpg"],"client":null,"hay":"together and happy 大家樂 2017 advertising / branding / mixed media / packaging / photography cafe de coral, a place where everyone finds joy.\n\nfor almost fifty years, cafe de coral has been a part of hongkongers’ life,\n\nin this half century…\n\ntogether, we have strived, turning a fishing port into the metropolis that it is today.\n\ntogether, we have supported each other, passing on the “lion rock spirit”.\n\ntogether, we have gone through ups and downs, good days and bad days.\n\ntogether, we live in harmony.\n\nthis is an important issue for hongkongers today.\n\nwith everything that is going on before our eyes,\n\nlet us get into the mood and walk into a cafe de coral together,\n\nall hongkongers being together as a family, sharing our happy yesterday, today and tomorrow.\n\nwhen there is everyone, there is happiness. 大家，樂也融融。\n\n大家樂走過香港人生活快將五十年，\n\n半個世紀中…\n\n大家一起拼搏，由漁港變成今天大都會。\n\n大家守望相助，傳承「獅子山精神」。\n\n大家共同渡過，風風雨雨起起跌跌的日子。\n\n大家。共融。\n\n相信是今天香港人生活的重大課題。\n\n面對眼前種種同時，\n\n騰出心情讓大家走進大家樂內，\n\n意識香港一家人，大家樂也融融的昨天、今天、明天。\n\n有大家，才有快樂。"},{"slug":"a009","who":"amm","title_en":"the future of hong kong post 2047 / when blue and yellow hug each other","title_cn":"","year":2017,"yearText":"2017","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a009/00.jpg","imgs":["/84000/content/works/a009/00.jpg","/84000/content/works/a009/01.jpg","/84000/content/works/a009/02.jpg","/84000/content/works/a009/03.jpg"],"client":null,"hay":"the future of hong kong post 2047 / when blue and yellow hug each other 2017 poster"},{"slug":"s009","who":"sw","title_en":"i love seoul","title_cn":"","year":2016,"yearText":"2016","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s009/00.jpg","imgs":["/84000/content/works/s009/00.jpg","/84000/content/works/s009/01.jpg","/84000/content/works/s009/02.jpg","/84000/content/works/s009/03.jpg"],"client":{"en":"alliance graphique internationale","cn":"alliance graphique internationale"},"hay":"i love seoul 2016 poster i love soul.\n\ni love seoul.\n\nit is our soul.\n\nit is our seoul."},{"slug":"x009","who":"xsw","title_en":"2 men show stanley wong x anothermountainman","title_cn":"","year":2016,"yearText":"2016","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/x009/00.jpg","imgs":["/84000/content/works/x009/00.jpg","/84000/content/works/x009/01.jpg","/84000/content/works/x009/02.jpg","/84000/content/works/x009/03.jpg"],"client":null,"hay":"2 men show stanley wong x anothermountainman 2016 poster an exhibition of over 30 years design journey, cross multi disciplines from graphics, film directing, to interiors, objects and clothing… a solo design show, starter on commercial world, migrated to personal values and evolved to the stage and then the commercial corporates working for the message towards society and life values… one person. two objectives."},{"slug":"a010","who":"amm","title_en":"united colours of 193","title_cn":"共融 一九三","year":2017,"yearText":"2017","category_en":"installation / multimedia","category_cn":"裝置 / 多媒體","cats":["installation","video","media"],"cover":"/84000/content/works/a010/00.jpg","imgs":["/84000/content/works/a010/00.jpg","/84000/content/works/a010/01.jpg","/84000/content/works/a010/02.jpg","/84000/content/works/a010/03.jpg"],"client":null,"hay":"united colours of 193 共融 一九三 2017 installation / multimedia red, white and blue signify freedom, equality and fraternity.\n\nthe yellow stars are the party, the working class, the peasantry, the urban petite bourgeoisie and the national bourgeoisie…\n\nthe colours and images on the national flags are the symbols of the utopian dreams and ideals of the nations.\n\nyet, once manifested in the international economic and political context, the “countries” represented by the 193 national flags, become engaged in an unending contest of status, power, contention and even conflict.\n\nthe source of man’s wisdom, after flowing through millions of years, has extended, expanded, and diversified into countless estuaries of cultures, histories and civilizations.\n\ncan this wisdom, concordant yet varied, be renewed and practised in the global village of today?\n\ncan we set aside the cultures, histories and ethnicity that divide and in mutual acceptance, unite under the spirits of our national flags, and begin a dialogue on the subject of “you” and “i”… 紅白藍是自由、平等、博愛。\n\n黃星是黨、工人、農民、城市小資產階級和民族資產階級之團結…\n\n各國國旗上的顏色，圖像都象徵着烏托邦的理想和目標。\n\n但落到國與國之間的概念，經濟、政治角度，一百九十三支國旗所代表的「國」\n\n就變得沒完沒了的身份，權力、角力以至紛爭。\n\n人的智慧由來，千萬年分流後之文化，歷史百花齊放，\n\n這和而不同的精神，可否重新在今日地球村派上用場？\n\n暫且收起各自文化、歷史、民族底蘊，\n\n將大家國旗來一次解構共融，以同一語境對話，\n\n面對何謂「你」和「我」的課題上面…"},{"slug":"s010","who":"sw","title_en":"tsz shan monastery / flower offering","title_cn":"慈山寺 / 花。供養","year":2016,"yearText":"2016","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s010/00.jpg","imgs":["/84000/content/works/s010/00.jpg","/84000/content/works/s010/01.jpg","/84000/content/works/s010/02.jpg","/84000/content/works/s010/03.jpg"],"client":null,"hay":"tsz shan monastery / flower offering 慈山寺 / 花。供養 2016 book invitation card for ikebana cultural exchange event 慈山寺 / 花。供養 邀請卡"},{"slug":"x010","who":"xsw","title_en":"fangsuo / insects","title_cn":"","year":2016,"yearText":"2016","category_en":"exhibition","category_cn":"展覽","cats":["exhibition"],"cover":"/84000/content/works/x010/00.jpg","imgs":["/84000/content/works/x010/00.jpg","/84000/content/works/x010/01.jpg","/84000/content/works/x010/02.jpg","/84000/content/works/x010/03.jpg"],"client":null,"hay":"fangsuo / insects 2016 exhibition an photo exhibit ion for a topic of “insects” inside the book store space, visi tors are expected to use torch to search the detai ls of the photo under a forest insects’ sound environment."},{"slug":"a011","who":"amm","title_en":"old master q too wonderful for words solo exhibition","title_cn":"老夫子。妙不可言。開個展","year":2016,"yearText":"2016","category_en":"poster / installation / multimedia","category_cn":"海報 / 裝置 / 多媒體","cats":["poster","installation","video","media"],"cover":"/84000/content/works/a011/00.jpg","imgs":["/84000/content/works/a011/00.jpg","/84000/content/works/a011/01.jpg","/84000/content/works/a011/02.jpg","/84000/content/works/a011/03.jpg"],"client":null,"hay":"old master q too wonderful for words solo exhibition 老夫子。妙不可言。開個展 2016 poster / installation / multimedia since 2000, i have been active on the contemporary art scene in hong kong, mainland china and overseas.\n\nundoubtedly, i have been given a lot of chances to express my views on social issues and values of life…\n\nand i am well aware of my position. my work is personal and i never claim that i am an artist, or that i am a creator in arts, i am not too concerned with whether my creation is a work of art.\n\nin 2012, i described the meaning of art as:\n\nto me, art is…\n\nany people, emotions, things that galvanise, rise and is then uplifted to a new level where others can feel, and be moved, affected, inspired and elevated by it.\n\nwong chak, senior and wong chak, junior are the creators of old master q. through master q, they immerse themselves in the reality of the comic world and project their values. a big thanks to master wong chak for referring master q to anothermountainman (the outsider). with his help, master q can finally make a decision, or be an artist for once.\n\nmaster q is very impractical, is a loser. is this his fate this time?\n\ncan master q lead and be an artist just for once?\n\ncan he be an artist?\n\nwho decides who is an artist?\n\nwho decides what is a work of art? 自二千年開始，開展及活躍於香港、國內以至海外當代藝術舞台。\n\n沒錯，我爭取到很多的機會發聲，社會議題的，或人生價值觀點⋯\n\n而且，我很清楚自己的立場，做的是個人創作，從沒有自稱藝術家，藝術工作者，做的是不是藝術品，我也不大關心。\n\n二零一二年也就藝術的意義作過以下的描述：\n\n藝術者，於我來說⋯\n\n凡任何事、情、人，一直沉澱，一直提升，昇華到一個境界，令人能感受到，或感動到，或感染到；或能引發靈感，帶動到另一個點，這就是藝術。\n\n老王澤和小王澤是老夫子背後的創作者。藉着他，化身自己在漫畫事實中，甚至情感價值之投射。多謝王澤老師將老夫子轉介「路人乙」又一山人，由他推波助瀾，讓老夫子主張一次，或者自以為是藝術家一次。\n\n老夫子不很實際，失敗者的形象，今趟可不是宿命？\n\n老夫子可不可以走在人前，做一次藝術大師？\n\n老夫子做不了藝術家？\n\n誰決定誰算是藝術家？\n\n誰決定甚麼才算是藝術品？"},{"slug":"s011","who":"sw","title_en":"buddhist chants in scent and light","title_cn":"香光念佛","year":2016,"yearText":"2016","category_en":"mixed media","category_cn":"跨媒體","cats":["media"],"cover":"/84000/content/works/s011/00.jpg","imgs":["/84000/content/works/s011/00.jpg","/84000/content/works/s011/01.jpg","/84000/content/works/s011/02.jpg","/84000/content/works/s011/03.jpg"],"client":{"en":"zuni icosahedron","cn":"zuni icosahedron"},"hay":"buddhist chants in scent and light 香光念佛 2016 mixed media"},{"slug":"x011","who":"xsw","title_en":"tribute to masters","title_cn":"向大師致敬","year":2015,"yearText":"2015","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/x011/00.jpg","imgs":["/84000/content/works/x011/00.jpg","/84000/content/works/x011/01.jpg","/84000/content/works/x011/02.jpg","/84000/content/works/x011/03.jpg"],"client":null,"hay":"tribute to masters 向大師致敬 2015 book to honour those japanese creative masters, it might takes no less than 10 pages……\n\na friend-like teacher shin mastsunaga, the deceased shigeo fukuda, a grand master tanaka ikko, tadano riyokoo, issey miyake, and many other names overwhelm my pen. you all enlightened me at the beginning of my career, leading me to the grand showroom of design and letting me inspired by the unlimited possibilities in creation.\n\nfor 35 years, i make visual creation as my means to interact with life and society. my deepest gratitude to ggg gallery for their invitation to organise this retrospective exhibition including works of commercial, utopian or even commercial and social values combined throughout my artistic trajectory.\n\nlooking back suddenly, at the beginning of my career in the 1980s, i received most of the influence and inspirations from the above mentioned japanese established and contemporary designers. we share the same passion and vision, progressing in a same path. it is almost like a resonance, a destiny for my retrospective exhibition to be held in tokyo, japan. after a long circular journey, i reach where i took off, with tribute to all masters:\n\nkazumasa nagai\n\nozu yasujiro\n\nkatsumi asaba\n\nyohji yamamoto\n\nrei kawakubo\n\nhiroshi sugimoto\n\nterunobu fujimori\n\nmakoto saito\n\nkenya hara\n\nnaoto fukasawa\n\nkaoru kasai\n\nhideki nakajima\n\ni whole-heartedly agree to a saying in design of my endeared friend hideki nakajima: “my everything is nurtured by your accomplishments which come to me by chance”. looking to the future, i shall continue to present oriental aesthetics, philosophy and humanity.\n\ngratitude to the heaven\n\nwith respects,\n\nanothermountainman 要數我尊敬的日本創意大師，可能寫上十頁紙也未能詳列…\n\n設計巨人如杉浦康平及田中一光先生，橫尾忠則先生，三宅一生先生，\n\n實在不能一一盡錄，亦師亦友之松永真先生及已去世之福田繁雄先生，\n\n你們都是我起步時期的啟蒙前行者，\n\n給我進入設計“大觀園”，嘗創意的無限可能……\n\n三十五年，藉着我唯一懂的視覺創作一直跟生活、社會同步呼吸，互動。\n\n感謝ggg畫廊禮重之邀，能讓我好好為自己總結過去的工作，有極商業的，\n\n有極理想烏托邦式的，也有商業跟社會價值並存的…\n\n驀然回首, 我成長八十年代初的路上，受感染的，受教的，\n\n心有共同種子，一起萌芽的，其實大都是來自日本的前輩和同輩，\n\n天意正好安排我這小總結在日本東京跟大家見面，能像一個圓圈走了一轉似的，\n\n帶回我對各老師，大師的一點敬意, 鄭重向\n\n永井一正\n\n小津安二郎\n\n浅葉克己\n\n山本耀司\n\n川久保玲\n\n杉本博司\n\n藤森照信\n\nmakoto saito\n\n原研哉\n\n深澤直人\n\n葛西薫\n\n中島英樹\n\n各大師說一句感激。\n\n萬分同意老友中島英樹先生在設計作品說 “我的一生, 都是大家給我氧份!\n\n因緣和合而成!”\n\n往前看，堅定在東方美學, 東方哲學價值，人文方向一直前進。\n\n感恩上天\n\n又一山人 合十"},{"slug":"s012","who":"sw","title_en":"hk01","title_cn":"","year":2016,"yearText":"2016","category_en":"branding","category_cn":"品牌","cats":["branding"],"cover":"/84000/content/works/s012/00.jpg","imgs":["/84000/content/works/s012/00.jpg","/84000/content/works/s012/01.jpg","/84000/content/works/s012/02.jpg"],"client":null,"hay":"hk01 2016 branding a keep changing typographic treatment for a hong kong media company “hk01″."},{"slug":"a012","who":"amm","title_en":"back to the future / tai chi","title_cn":"回到未來 / 太極","year":2014,"yearText":"2014","category_en":"multimedia","category_cn":"多媒體","cats":["video","media"],"cover":"/84000/content/works/a012/00.jpg","imgs":["/84000/content/works/a012/00.jpg","/84000/content/works/a012/01.jpg","/84000/content/works/a012/02.jpg"],"client":null,"hay":"back to the future / tai chi 回到未來 / 太極 2014 multimedia back to the past, back to the future.\n\nback to the ultimate speed of light, back to the basic.\n\nrunning forward…\n\nis fast. is exploration.\n\nlooking backward…\n\nis slow. is inspiration. 回到過去，回到未來。\n\n回到光速極速，回到基本還原。\n\n向前走…\n\n是快。是探索。\n\n往後看…\n\n是慢。是靈感所在。"},{"slug":"x012","who":"xsw","title_en":"what’s next 30×30 books","title_cn":"","year":2014,"yearText":"2014","category_en":"exhibition / branding / book","category_cn":"展覽 / 品牌 / 書籍","cats":["exhibition","branding","book"],"cover":"/84000/content/works/x012/00.jpg","imgs":["/84000/content/works/x012/00.jpg","/84000/content/works/x012/01.jpg","/84000/content/works/x012/02.jpg","/84000/content/works/x012/03.jpg"],"client":{"en":"the commercial press (hk) ltd","cn":"the commercial press (hk) ltd"},"hay":"what’s next 30×30 books 2014 exhibition / branding / book anothermountainman initiated the “what’s next 30×30″ creative project on the thirtieth year of his creative career. look back, be present and move forward, individually and collectively. presents a creative future with humanistic and social vision with 30 international artists/designers for the next generation in the integrated forms of dialogue, art exhibition, forums and finally comes to the books.\n\nthe books are a details archives which are creatived based on the works contributed and collaborated by the 30 international artists and designers with anothermountainman. the books include part one, dialoge with all guests for the topic “what’s next”, in which cover the current issues on creative education, social issues and creative values, etc. part two is the book about the exhibition."},{"slug":"s013","who":"sw","title_en":"ynot","title_cn":"","year":2016,"yearText":"2016","category_en":"branding","category_cn":"品牌","cats":["branding"],"cover":"/84000/content/works/s013/00.jpg","imgs":["/84000/content/works/s013/00.jpg","/84000/content/works/s013/01.jpg","/84000/content/works/s013/02.jpg","/84000/content/works/s013/03.jpg"],"client":null,"hay":"ynot 2016 branding visual identity system for an fashion brand “ynot”."},{"slug":"a013","who":"amm","title_en":"bearwhiteblue","title_cn":"熊白藍","year":2014,"yearText":"2014","category_en":"object","category_cn":"物件","cats":["object","redwhiteblue"],"cover":"/84000/content/works/a013/00.jpg","imgs":["/84000/content/works/a013/00.jpg","/84000/content/works/a013/01.jpg","/84000/content/works/a013/02.jpg","/84000/content/works/a013/03.jpg"],"client":null,"hay":"bearwhiteblue 熊白藍 2014 object redwhiteblue"},{"slug":"x013","who":"xsw","title_en":"home","title_cn":"家","year":2014,"yearText":"2014","category_en":"exhibition / poster","category_cn":"展覽 / 海報","cats":["exhibition","poster"],"cover":"/84000/content/works/x013/00.jpg","imgs":["/84000/content/works/x013/00.jpg","/84000/content/works/x013/01.jpg","/84000/content/works/x013/02.jpg","/84000/content/works/x013/03.jpg"],"client":{"en":"fangsuo","cn":"fangsuo"},"hay":"home 家 2014 exhibition / poster to create a hundred chinese character “home 家”,\n\nsome are based on traditional chinese writing styles from different period,\n\nsome are designed in a contemporary manner.\n\nfangsuo is a retail platform to promote asia aesthetics and asia value,\n\nthis poster shows how to build the youngsters interest on traditional chinese history and cultures."},{"slug":"s014","who":"sw","title_en":"pye / integral","title_cn":"十如","year":2014,"yearText":"2014","category_en":"branding","category_cn":"品牌","cats":["branding"],"cover":"/84000/content/works/s014/00.jpg","imgs":["/84000/content/works/s014/00.jpg","/84000/content/works/s014/01.jpg","/84000/content/works/s014/02.jpg","/84000/content/works/s014/03.jpg"],"client":{"en":"esquel enterprises limited","cn":"esquel enterprises limited"},"hay":"pye / integral 十如 2014 branding integral conversation provides an independent platform for thought leaders and experts to bring together their insights and perspectives on a range of topics in relation to sustainability including manufacturing, building and construction, products and technologies, culture and tourism and more. it take place in guilin provide a backdrop for the meaningful dialogues while allowing us to reflect on the future.\n\nthe integral is about understanding the philosophy and realms of existence,\n\nand searching for a new development model.\n\nform. nature. embodiment.\n\npotency. function. cause.\n\nrelation. effect. rebalance.\n\ncomplete fundamental whole.\n\nthe integral conversation provides an independent platform for thought leaders and experts from diverse fields to bring together their insights and perspectives on a range of topics in relation to sustainability including manufacturing, building and construction, products and echnologies, culture and tourism and more. the dialogue will take place in guilin, a city known for its well-preserved stunning landscape and waters. the location will provide a backdrop for the meaningful dialogues while allowing us to reflect on the future of sustainable development – how will we achieve economic progress which is in harmony with the environment and society? 十如 is a buddhism word means ten ways for ideal within a full circle."},{"slug":"x014","who":"xsw","title_en":"bless hong kong","title_cn":"","year":2013,"yearText":"2013","category_en":"advertising","category_cn":"廣告","cats":["advertising"],"cover":"/84000/content/works/x014/00.jpg","imgs":["/84000/content/works/x014/00.jpg","/84000/content/works/x014/01.jpg","/84000/content/works/x014/02.jpg","/84000/content/works/x014/03.jpg"],"client":null,"hay":"bless hong kong 2013 advertising"},{"slug":"a014","who":"amm","title_en":"ingenuity. nature.","title_cn":"妙法自然","year":2012,"yearText":"2012","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a014/00.jpg","imgs":["/84000/content/works/a014/00.jpg","/84000/content/works/a014/01.jpg","/84000/content/works/a014/02.jpg","/84000/content/works/a014/03.jpg"],"client":null,"hay":"ingenuity. nature. 妙法自然 2012 poster water calligraphy.\n\nit has been in my mind ever since\n\ni experienced the touching feat firsthand\n\nin a park of china many years ago.\n\nit response to the form and emptiness of the buddhist.\n\neverything from absence to presence, and\n\nfrom presence to absence.\n\nform is emptiness.\n\nemptiness is form.\n\ntong yang-tze is ingenuity.\n\nwater calligraphy is nature.\n\nwater calligraphy.\n\non and off\n\nit has been in my mind\n\never since i experienced the touching feat firsthand\n\nin a park of china many years ago.\n\nit is the most meaningful response to\n\nthe form and emptiness of the buddhist.\n\neverything from absence to presence,\n\nand from presence to absence.\n\nform itself is emptiness.\n\nemptiness itself is form.\n\nwhile we are reading the ingenuity of tong’s calligraphy quietly,\n\nwe could also enjoy the experience of water calligraphy,\n\nto think about the ultimate meaning of life in nature. 水書法｡\n\n多年前在中國公園親歷奇境後，\n\n一直都在我腦裡出出入入｡\n\n它正是佛法中色空\n\n最微妙的對應｡\n\n一切從無到有，從有到無｡\n\n色即是空｡\n\n空即是色｡\n\n當大家靜觀董老師書道之妙法，\n\n亦揮一筆水中書，\n\n參出大自然中生命之究竟｡"},{"slug":"s015","who":"sw","title_en":"another paris","title_cn":"","year":2014,"yearText":"2014","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/s015/00.jpg","imgs":["/84000/content/works/s015/00.jpg","/84000/content/works/s015/01.jpg","/84000/content/works/s015/02.jpg","/84000/content/works/s015/03.jpg"],"client":{"en":"ming pao weekly","cn":"ming pao weekly"},"hay":"another paris 2014 photography"},{"slug":"a015","who":"amm","title_en":"lanwei","title_cn":"爛尾","year":2012,"yearText":"2006-2012","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a015/00.jpg","imgs":["/84000/content/works/a015/00.jpg","/84000/content/works/a015/01.jpg","/84000/content/works/a015/02.jpg","/84000/content/works/a015/03.jpg"],"client":null,"hay":"lanwei 爛尾 2012 photography abortive building projects are the ‘fruits’ of\n\ntwo to three decades of fruitless chase\n\nafter a future, an opportunity, desires\n\nand dreams in a liberated society,\n\nat a time of seemingly\n\nlimitless economic expansion.\n\nbuildings can be aborted, so can projects.\n\nplans may be aborted. so may hopes.\n\nties between people could be aborted,\n\nso could relationships.\n\nlife, i guess should not be aborted.\n\n[p.s. i have been harbouring the concept of shooting abortive building projects\n\nin my mind for 5 years. fortunately, on the eve of government actions to clean up\n\nthe mess, this concept finally became a reality, sparing it from being yet another\n\nabortive attempt.]\n\nbackground /\n\nas china relaxed the restrictions and reopened her doors to foreign investments\n\nin the 1980’s, the whole nation was thrust into a craze of buying and selling of\n\nalmost anything that had a slight hint of profit. property projects became the most\n\nsought-after investments. in order not to lose out, people hastened to pour their\n\nlifelong savings into real estate deals, sometimes without having even seen a brick.\n\nwith corruption prevalent and an overheated economy, problems soon abounded.\n\nthe bubble finally burst and millions of square meters of land were left unfinished.\n\nin 1998, in hainan alone, a combined floor space of 16.3 million square meters\n\nwere aborted or left unfinished.* this wave of abortive building construction spread\n\nacross other asian cities which were also experiencing meteoric economic growth.\n\npeople in china termed these projects ‘lan wei lou’, ‘lan’ meaning ‘decaying’,\n\n‘rotting’ while ‘wei’ is ‘the tail’, ‘the ending’. therefore, ‘lan wei’ has in it,\n\nmore than just ‘unfinished’. for some reasons or other, it was just not possible\n\nto complete these ‘lou’ or ‘buildings’. there were simply no solutions or closure.\n\nin time, the concept of ‘lan wei’extends beyond building projects.\n\nit becomes synonymous with anything that is aborted while in progress,\n\nfor reasons unknown. these photos attempt to capture the relics of this ma\n\n‘gold rush’ and, at the same time, reflect on how,\n\nthroughout the years, ‘lan wei’ has manifested itself not only in building projects\n\nbut also in all aspects of life.\n\n* “china’s island province mounts fight against housing bubble”. people’s daily\n\nonline, 26 september, 2005. 在社會的開放，或者經濟極速發展的背景底下；\n\n爛尾樓正是過去兩三個年代一群活在大時代的人對\n\n前景、機會、人心和夢想的一場搏鬥沒結果的結果。\n\n建築會爛尾。工程會爛尾。\n\n計劃會爛尾。希望會爛尾。\n\n關係會爛尾。人情會爛尾。\n\n人生。我想不應該爛尾吧。\n\n[ p.s. 這個在腦袋不斷浮現的爛尾攝影念頭，不覺已經超過五個年頭。\n\n幸好終於在政府收拾爛攤前在現實中實現出來，不致爛尾收場。]\n\n背景 /\n\n中國八十年代經濟政策對外開放改革，激發起一場全國性追捧金錢的憧憬或是夢想。\n\n一窩蜂投資，買賣的熱潮由重點開放城市深圳散播到南中國以至全國。\n\n人民為怕「執輸行頭」，就算連一磚一瓦還未有看過，就拿出一生積蓄投資地產樓房。\n\n過熱的經濟文化、貪污及其他人為的問題隨之而來，不久就刺破了這巨大的泡沫，\n\n導致數百萬平方米土地發展，半工而廢。\n\n單算一九九八年海南這地區就有一千六百三十萬平方米 [建築樓面計算]* 之建築項目淪為爛尾。\n\n過去二十年間，這股爛尾潮流亦擴展到其他亞洲金融急起的城市⋯\n\n「爛尾」之攝影系列，希望從爛尾樓房出發，穿梭生活中不同的人民爛尾故事，\n\n反照我對近代中國一些人和事，以致生命的一些着眼，一些看法。\n\n* 節錄自人民日報網二零零五年九月廿六日。"},{"slug":"x015","who":"xsw","title_en":"jing yat","title_cn":"正一","year":2012,"yearText":"2012","category_en":"advertising / mixed media","category_cn":"廣告 / 跨媒體","cats":["advertising","media"],"cover":"/84000/content/works/x015/00.jpg","imgs":["/84000/content/works/x015/00.jpg","/84000/content/works/x015/01.jpg"],"client":{"en":"sun life financial","cn":"sun life financial"},"hay":"jing yat 正一 2012 advertising / mixed media the film ‘jing yat’ is developed from my installation work ‘painting by god’\n\nwhich was first showcased in anexhibition in 2008. \n\nthey carry the same message: embrace life. embrace the nature.  \n\njing yat was born in hong kong in the 1960s, same age as mine. all slices of life,\n\npeople relations and dreams featured in the film…\n\nare what i still believe in and will not change with time.\n\nthis is the first feature short film in my 30 years of creative career, sponsored by sun life financial.\n\nthe film ‘jing yat’ is developed from my installation work ‘painting by god’\n\nwhich was first showcased in anexhibition in 2008. \n\nthey carry the same message: embrace life. embrace the nature.  \n\njing yat was born in hong kong in the 1960s, same age as mine. all slices of life,\n\npeople relations and dreams featured in the film…\n\nare what i still believe in and will not change with time.\n\nthis is the first feature short film in my 30 years of creative career, sponsored by sun life financial. 由我零八年開始的裝置創作「神畫」到今天轉化為十三分鐘的短片「正一」， \n\n信息都是同一個 — 擁抱生命，擁抱大自然｡  \n\n正一生於一九六零代的香港，是從我自身的背景出發，\n\n中間的生活點滴､親情友情､夢想，\n\n都是我五十年來一直沒有改變過，堅定的……\n\n這是三十年創作生涯的首次電影短片創作，由永明金融贊助｡\n\n由我零八年開始的裝置創作「神畫」到今天轉化為十三分鐘的短片「正一」， \n\n信息都是同一個 — 擁抱生命，擁抱大自然｡  \n\n正一生於一九六零代的香港，是從我自身的背景出發，\n\n中間的生活點滴､親情友情､夢想，\n\n都是我五十年來一直沒有改變過，堅定的……\n\n這是三十年創作生涯的首次電影短片創作，由永明金融贊助｡"},{"slug":"s016","who":"sw","title_en":"ming pao weekly cover","title_cn":"明報周刊封面","year":2014,"yearText":"2014","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s016/00.jpg","imgs":["/84000/content/works/s016/00.jpg","/84000/content/works/s016/01.jpg","/84000/content/works/s016/02.jpg","/84000/content/works/s016/03.jpg"],"client":{"en":"ming pao weekly","cn":"ming pao weekly"},"hay":"ming pao weekly cover 明報周刊封面 2014 book"},{"slug":"x016","who":"xsw","title_en":"time will tell","title_cn":"時間的見證","year":2012,"yearText":"2012","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/x016/00.jpg","imgs":["/84000/content/works/x016/00.jpg","/84000/content/works/x016/01.jpg","/84000/content/works/x016/02.jpg","/84000/content/works/x016/03.jpg"],"client":{"en":"exception de m udity / a nude? / a misforture? / a disability? 山人：人物系列一 / 裸體？ / 裸像？ / 不幸？ / 殘障？ 2011 poster / photography as a child, william chan was diagnosed with skin cancer.\n\n he could not look forward to a long life.\n\n he refused to give in. he refused to give up.  \n\nmiraculously, resiliently, he lives, alive and doing well.\n\n he bore the pain on his skin, the pain of being despised.  \n\nand this year, he persevered past the finishing line of  \n\nthe greece and hong kong marathon.\n\nthis is the first of my series of portraits.\n\n my tribute to the people who have touched my heart. 陳偉霖自兒時已被醫生定診皮膚癌在身，\n\n 不能奢望長久的生命⋯⋯ \n\n不認命，不自棄的他，奇蹟地，頑強地還好好活過來。\n\n 皮上身上的痛，被人冷眼的痛，他都抵禦過來， \n\n今年還堅持完成希臘和香港的馬拉松跑步。\n\n這是我人物攝影系列的起點，希望向感動我的人來一個點頭致意。"},{"slug":"s017","who":"sw","title_en":"one eye","title_cn":"一目了然","year":2014,"yearText":"2014","category_en":"exhibition / poster","category_cn":"展覽 / 海報","cats":["exhibition","poster"],"cover":"/84000/content/works/s017/00.jpg","imgs":["/84000/content/works/s017/00.jpg"],"client":null,"hay":"one eye 一目了然 2014 exhibition / poster"},{"slug":"a017","who":"amm","title_en":"everywhere kowloon king / everywhere redwhiteblue / the code of kowloon king","title_cn":"無處不在曾灶財","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster","redwhiteblue"],"cover":"/84000/content/works/a017/00.jpg","imgs":["/84000/content/works/a017/00.jpg"],"client":null,"hay":"everywhere kowloon king / everywhere redwhiteblue / the code of kowloon king 無處不在曾灶財 2011 poster redwhiteblue since the project of “building hong kong redwhiteblue”,\n\n(keep promoting positive hong kong message through\n\nthe plastic canvas ‘redwhiteblue’)\n\ni targeted to be everywhere like king of kowloon but\n\nwith a licence not like our king who did it illegally…..\n\nthe pair of posters are the messages to reflect (blue side)\n\nand to dream (red side) my eyes of hong kong now,\n\nin which the words are re-ordered from the 8 panels of\n\noriginal calligraphy works from the king\n\nwho personally donefor me years ago.\n\nthe messages are about eat and buy,\n\nstock market and property, chasing for money, of course\n\nthere are also politic and social issues,\n\ndreams & hope of hong kong.\n\nwish this is our way of positive hong kong,\n\nit is a dream, it is not an illusion. 自從2001香港建築紅白藍的開始，\n\n便打算做個”領正牌照”的曾灶財，\n\n“無處不在” 作為目標，\n\n將紅白藍正面香港推銷滲透⋯\n\n就借曾灶財給我這八板文字，\n\n重組轉化成我對香港的一些看法和\n\n祈望在於一對海報中。\n\n當中有吃喝玩樂，有拜金炒股，\n\n亦有政治、社會、理想。\n\n謹希望我這個正面香港信念\n\n不是妄想和幻想⋯"},{"slug":"x017","who":"xsw","title_en":"a life of love","title_cn":"久愛一生","year":2011,"yearText":"2011","category_en":"graphic","category_cn":"平面","cats":["graphic"],"cover":"/84000/content/works/x017/00.jpg","imgs":["/84000/content/works/x017/00.jpg","/84000/content/works/x017/01.jpg","/84000/content/works/x017/02.jpg","/84000/content/works/x017/03.jpg"],"client":{"en":"exception de mixmind","cn":"exception de mixmind"},"hay":"a life of love 久愛一生 2011 graphic “letter” is a way of communication, a media to pass on feelings between human-kind. now a day, technology replaces the way we used to communicate, pen and letter become obsolete. there are less personal interactions. exception interprets new vintage through “letter”, to arouse our love hidden inside our heart.\n\n“a life of love” catalogue was designed with a series of “letter”, it illustrates the four kind of\n\nlove in human relationship: father/ first love/ marriage and family.\n\n“letter” is hand-written. it is a metaphor of direct and simple relationship in mankind which is\n\nneglected in our society due to life occupied by work, technology and social network.\n\n“letter” keeps our message and love forever. every time we open a letter, we found love and\n\nmemory. it’s functionary could never be replaced by technology.\n\n“a life of love” catalogue hope to awaken our love, a simple pile of letters give us a personal\n\nand humanity connection. it is our most treasured possessions."},{"slug":"s018","who":"sw","title_en":"sy land/upperhills branding","title_cn":"","year":2013,"yearText":"2013","category_en":"branding / website","category_cn":"品牌 / 網站","cats":["branding","media","website"],"cover":"/84000/content/works/s018/00.jpg","imgs":["/84000/content/works/s018/00.jpg","/84000/content/works/s018/01.jpg","/84000/content/works/s018/02.jpg","/84000/content/works/s018/03.jpg"],"client":{"en":"shum yip land company limited","cn":"shum yip land company limited"},"hay":"sy land/upperhills branding 2013 branding / website brand position of upperhills is unlike the usual & common property investor in which heading towards western & luxury, materialistic approach, upperhills is taking emotional & spiritual approach to inspire chinese consumers. upperhills is a total living compound set in china shenzhen including residential, retails, business, hotel, design & art. given the world class town planning and architectural design, worked very close with client,we left behind the usual routes for property brand building direction（western life style, materialistic enjoyment ), we breakthrough the norm, go for spiritual and inner value of people, consider it is the most important phenomenon and inspirations of our life, the turning point for now china, or even the whole world."},{"slug":"a018","who":"amm","title_en":"form. emptiness","title_cn":"色. 空","year":2011,"yearText":"2011","category_en":"multimedia","category_cn":"多媒體","cats":["video","media"],"cover":"/84000/content/works/a018/00.jpg","imgs":["/84000/content/works/a018/00.jpg","/84000/content/works/a018/01.jpg","/84000/content/works/a018/02.jpg","/84000/content/works/a018/03.jpg"],"client":null,"hay":"form. emptiness 色. 空 2011 multimedia water calligraphy. \n\non and off, it has been on my mind\n\never since that experienced first-hand encounter\n\nin a guangzhou park many years ago.\n\nit is truly the most meaningful response\n\nto the form and emptiness of the buddhist.\n\neverything from absence to presence, and from presence to absence.\n\nform itself is emptiness. emptiness itself is form.\n\nit is not just its history and humanity,\n\nit is not just its execution and environmentalism,\n\nit is not just the zen-like meditation quality of its practice. 水書法。 \n\n多年前在廣州公園\n\n親歷奇境後，\n\n一直都在我腦裡 \n\n出出入入。\n\n它正是 \n\n佛法中色空 \n\n最微妙的對應。\n\n一切從無到有， \n\n從有到無。\n\n色即是空。 \n\n空即是色。\n\n不止是\n\n它的歷史和人文。\n\n不止是 \n\n它的經營和環保。 \n\n不止是\n\n它像禪修式鍛鍊。"},{"slug":"x018","who":"xsw","title_en":"what’s next 30×30","title_cn":"what’s next 三十乘三十","year":2011,"yearText":"2011","category_en":"exhibition / branding / book","category_cn":"展覽 / 品牌 / 書籍","cats":["exhibition","branding","book"],"cover":"/84000/content/works/x018/00.jpg","imgs":["/84000/content/works/x018/00.jpg","/84000/content/works/x018/01.jpg","/84000/content/works/x018/02.jpg","/84000/content/works/x018/03.jpg"],"client":null,"hay":"what’s next 30×30 what’s next 三十乘三十 2011 exhibition / branding / book in any case it is an excuse, but for one reason…\n\nthe excuse:\n\ni needed to have a ( small ) review of the 30 years i spent travelling on the creative path, before moving forward.\n\nthe reason:\n\nand i kept on pondering. it may actually be a good idea taking a macro\n\nview at the ecology of our creative global village, its past, its present, and how we should embrace “what’s next”.\n\nin my thirty years on this creative journey, i have had many encounters\n\nwith many creative contemporaries and comrades with different goals.\n\nmany of them are great successes, many i regard with great respect,\n\nsome even with great admiration. a small creative tribe that has strived on an ideal that has set them apart from those on the bandwagon. their commitment and perseverance have been a staunch reminder and encouragement for me to hold my stance…\n\nthis thought started to brew in me three years ago, the thought of pulling together a group of like-minded people, to make a tribal call with a louder voice.\n\nthat’s how what’s next 30 × 30 came to take shape, slowly.\n\ni need to thank 30 units (a total of 32 people) for their support and\n\nparticipation. we’re a tribe with four generations among ourselves.\n\nthey meant a great deal to every step i made along the way, giving me\n\ninspiration, sentiment, admonishment, encouragement, and hope.\n\ni guess i am quite blessed. because of my curiosity, my work in advertising, my sheer luck, i have walked and flew along a path longer and wider than many others, encountering many people, emotions and events…\n\nfor thirty years i have been asking:\n\nwhat is creative, why do we create.\n\ncreative. it is a commercial act.\n\ncreative. it is history, culture and personal emotion.\n\ncreative. it is inspiration, dialogue and articulation on social issues.\n\ncreative. it is about life.\n\ni look upon myself, i didn’t get too far off to forget my way home.\n\nhere and now, i stand in my home, my heart,\n\ni hope to share with you all.\n\nin any case it is an excuse, but for one reason…\n\nthe excuse:\n\ni needed to have a (small) review of the 30 years i spent travelling on\n\nthe creative path, before moving forward.\n\nthe reason:\n\nand i kept on pondering. it may actually be a good idea taking a macro\n\nview at the ecology of our creative global village, its past, its present,\n\nand how we should embrace “what’s next”.\n\nin my thirty years on this creative journey, i have had many encounters\n\nwith many creative contemporaries and comrades with different goals.\n\nmany of them are great successes, many i regard with great respect,\n\nsome even with great admiration. a small creative tribe that has strived\n\non an ideal that has set them apart from those on the bandwagon.\n\ntheir commitment and perseverance have been a staunch reminder and\n\nencouragement for me to hold my stance…\n\nthis thought started to brew in me three years ago, the thought of pulling\n\ntogether a group of like-minded people, to make a tribal call with a louder voice.\n\nthat’s how what’s next 30 × 30 came to take shape, slowly.\n\ni need to thank 30 units (a total of 32 people) for their support and\n\nparticipation. we’re a tribe with four generations among ourselves.\n\nthey meant a great deal to every step i made along the way, giving me\n\ninspiration, sentiment, admonishment, encouragement, and hope.\n\ni guess i am quite blessed. because of my curiosity, my work in advertising,\n\nmy sheer luck, i have walked and flew along a path longer and wider than\n\nmany others, encountering many people, emotions and events…\n\nfor thirty years i have been asking:\n\nwhat is creative, why do we create.\n\ncreative. it is a commercial act.\n\ncreative. it is history, culture and personal emotion.\n\ncreative. it is inspiration, dialogue and articulation on social issues.\n\ncreative. it is about life.\n\ni look upon myself, i didn’t get too far off to forget my way home.\n\nhere and now, i stand in my home, my heart,\n\ni hope to share with you all. 反正都是一個借口， 皆因一個理由⋯⋯\n\n借口：\n\n我要為自己做三十年創作來個 （小） 總結，然後再上路。\n\n理由:\n\n然後想了又想，何不宏觀地看看創作村的生態，\n\n過去和現在，正在怎樣迎接明天。\n\n三十年路途上遇過很多不同目標的創意同業，同志。\n\n很多成功的，很多我尊重的，更有我敬佩的，\n\n一小族群的創作理念原動力，亦有別於其他大隊中人，\n\n其堅持和執着每每在鼓勵和鞭策我自己堅守在本份上⋯⋯\n\n三年前就開始了這個構想，集合一群志向相同的人，\n\n發一個更大的聲音和呼喚，於是what’s next 30 × 30\n\n就慢慢推進。\n\n多謝三十單位 （共三十二人） 共同參與和支持，\n\n這橫跨四個世代的族群，對我行過的每一步意義重大，\n\n包括着啟發，感動，教誨，激勵和希望。\n\n有一點我倒為自己慶幸；\n\n因為我好奇，因為我的廣告工作，因為運氣，\n\n三十年來行過，飛過比很多人多的路，見過很多人、情、事⋯⋯\n\n三十年來不斷地問:\n\n何謂創作，為何創作。\n\n創作。是商業的手段。\n\n創作。是歷史、文化和個人情懷。\n\n創作。是社會議題的靈感、對話、發聲⋯⋯\n\n創作。是關於人生的事情。\n\n看着自己，沒因走到太遠，不懂路回家。\n\n當下，我站在自己的家，自己的心田。\n\n與大家共勉。\n\n反正都是一個借口， 皆因一個理由⋯⋯\n\n借口：\n\n我要為自己做三十年創作來個 （小） 總結，然後再上路。\n\n理由:\n\n然後想了又想，何不宏觀地看看創作村的生態，\n\n過去和現在，正在怎樣迎接明天。\n\n三十年路途上遇過很多不同目標的創意同業，同志。\n\n很多成功的，很多我尊重的，更有我敬佩的，\n\n一小族群的創作理念原動力，亦有別於其他大隊中人，\n\n其堅持和執著每每在鼓勵和鞭策我自己堅守在本份上⋯⋯\n\n三年前就開始了這個構想，集合一群志向相同的人，\n\n發一個更大的聲音和呼喚，於是what’s next 30 × 30\n\n就慢慢推進。\n\n多謝三十單位 （共三十二人） 共同參與和支持，\n\n這橫跨四個世代的族群，對我行過的每一步意義重大，\n\n包括著啟發，感動，教誨，激勵和希望。\n\n有一點我倒為自己慶幸；\n\n因為我好奇，因為我的廣告工作，因為運氣，\n\n三十年來行過，飛過比很多人多的路，見過很多人、情、事⋯⋯\n\n三十年來不斷地問:\n\n何謂創作，為何創作。\n\n創作。是商業的手段。\n\n創作。是歷史、文化和個人情懷。\n\n創作。是社會議題的靈感、對話、發聲⋯⋯\n\n創作。是關於人生的事情。\n\n看著自己，沒因走到太遠，不懂路回家。\n\n當下，我站在自己的家，自己的心田。\n\n與大家共勉。"},{"slug":"s019","who":"sw","title_en":"the king of kowloon: the art of tsang tsou choi","title_cn":"","year":2013,"yearText":"2013","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s019/00.jpg","imgs":["/84000/content/works/s019/00.jpg","/84000/content/works/s019/01.jpg","/84000/content/works/s019/02.jpg","/84000/content/works/s019/03.jpg"],"client":{"en":"damiani / vermillion art collections","cn":"damiani / vermillion art collections"},"hay":"the king of kowloon: the art of tsang tsou choi 2013 book “king of kowloon: the art of tsang tsou-choi” is the first major monograph\n\nof the notorious artist/cultural icon tsang tsou choi (aka king of kowloon).\n\nit represents a milestone in the history of hong kong visual culture and\n\npresents the largest-ever collection of tsang’s artworks to date.\n\nan icon in his native city, tsang tsou choi (1921–2007) covered the streets of hong kong with his graffiti for over 35 years, using a brush and ink to proclaim himself “the king of kowloon”–heir to an imaginary birthright that fueled a lifetime of artistic output. with his signature style, tsang wrote himself into the collective memory of a generation caught between british and chinese rule, leaving behind an oeuvre that includes countless outdoor projects (the majority now extant only in photographs), myriad works on paper, board and cloth, as well as painted objects. this milestone publication documents tsang’s influential art and enduring legacy.\n\nwith over 100 reproductions, a foreword by hans-ulrich obrist and critical essays by hou hanru, ou ning and others, the king of kowloon is the first comprehensive survey of tsang’s complex and fascinating artistic output."},{"slug":"a019","who":"amm","title_en":"infinite prospect","title_cn":"無限風光","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a019/00.jpg","imgs":["/84000/content/works/a019/00.jpg"],"client":null,"hay":"infinite prospect 無限風光 2011 poster heaven and earth. ages. time. traces. \n\nbefore my eyes. a picture of beauty. \n\nin my heart. a path of infinite prospect. 天地。歲月。時間。痕跡。 \n\n眼前。一幅美麗景象。 \n\n心內。一路無限風光。"},{"slug":"x019","who":"xsw","title_en":"exception 08 summer show","title_cn":"","year":2008,"yearText":"2008","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/x019/00.jpg","imgs":["/84000/content/works/x019/00.jpg"],"client":{"en":"exception de mixmind","cn":"exception de mixmind"},"hay":"exception 08 summer show 2008 poster"},{"slug":"s020","who":"sw","title_en":"improvisation / jazz & design / niklaus troxler","title_cn":"","year":2013,"yearText":"2013","category_en":"exhibition / poster","category_cn":"展覽 / 海報","cats":["exhibition","poster"],"cover":"/84000/content/works/s020/00.jpg","imgs":["/84000/content/works/s020/00.jpg","/84000/content/works/s020/01.jpg","/84000/content/works/s020/02.jpg","/84000/content/works/s020/03.jpg"],"client":{"en":"the oct art & design gallery","cn":"the oct art & design gallery"},"hay":"improvisation / jazz & design / niklaus troxler 2013 exhibition / poster like the spirit of jazz music,\n\nimprovisation, is the same experience from\n\nthe poster audiences.\n\nevery visitor is invited to play a part to interact\n\nand improvise with the poster by stamping the circles on\n\ntop, endless possibility,\n\nmove like music…\n\nit creates huge positive interactive response\n\nthrough out the process of ‘chopping’,\n\nto create and complete the design of the poster.\n\nit is an extremely effective way\n\nto experience the idea of improvisation of jazz music."},{"slug":"a020","who":"amm","title_en":"life, is like a ping pong match","title_cn":"人生，有如一場乒乓球賽","year":2011,"yearText":"2011","category_en":"installation / object","category_cn":"裝置 / 物件","cats":["installation","object"],"cover":"/84000/content/works/a020/00.jpg","imgs":["/84000/content/works/a020/00.jpg","/84000/content/works/a020/01.jpg"],"client":null,"hay":"life, is like a ping pong match 人生，有如一場乒乓球賽 2011 installation / object at a presentation by master asaba, he said, \n\n“life, is like a game of ping pong. \n\nthe ball is now at your side of the table, you strike it back.\n\nthe ball is here again, and again you strike it back…”\n\nhis words were imprinted on my mind.\n\nlife is so unpredictable, \n\nand events can catch you by surprise, one after another. \n\nthe volcanic eruption of iceland, \n\nearthquakes in various countries and the tsunami in japan.\n\njust when we thought we knew\n\nthe rule of the game, the rules are changed, demanding double effort. \n\nwill you still take the challenge? 聽了淺葉克己老師一次演講這樣說：\n\n「人生，有如一場乒乓球賽。 球過來，你就推過去。\n\n球又再過來，你又再推回去⋯⋯」\n\n很深刻的記在心裡。\n\n人生無常，世間無常之事接二連三，\n\n冰島火山爆發，不同國家之地震和日本海嘯。\n\n當大家認定了球賽的規則時，\n\n突然發現被改加了一倍難度；\n\n你可還落場應戰這場遊戲嗎？"},{"slug":"x020","who":"xsw","title_en":"exception act-itutde seed","title_cn":"","year":2008,"yearText":"2008","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/x020/00.jpg","imgs":["/84000/content/works/x020/00.jpg"],"client":{"en":"exception de mixmind","cn":"exception de mixmind"},"hay":"exception act-itutde seed 2008 poster"},{"slug":"s021","who":"sw","title_en":"mv (alex fung feat. chochukmo)","title_cn":"飲酒 mv (馮翰銘 feat. 觸執毛)","year":2013,"yearText":"2013","category_en":"mixed media","category_cn":"跨媒體","cats":["media"],"cover":"/84000/content/works/s021/00.jpg","imgs":["/84000/content/works/s021/00.jpg","/84000/content/works/s021/01.jpg","/84000/content/works/s021/02.jpg","/84000/content/works/s021/03.jpg"],"client":null,"hay":"mv (alex fung feat. chochukmo) 飲酒 mv (馮翰銘 feat. 觸執毛) 2013 mixed media"},{"slug":"a021","who":"amm","title_en":"live now 2 :now","title_cn":"當下二 :now","year":2011,"yearText":"2011","category_en":"object","category_cn":"物件","cats":["object"],"cover":"/84000/content/works/a021/00.jpg","imgs":["/84000/content/works/a021/00.jpg","/84000/content/works/a021/01.jpg","/84000/content/works/a021/02.jpg"],"client":null,"hay":"live now 2 :now 當下二 :now 2011 object when is now?\n\nwhere do we go next?\n\nwhat did we do just now?\n\nwork on a now? or do b first?\n\nthinking about b while working on a?\n\nlive now.\n\nexplicitly now.\n\nfocus myself at now.\n\nthe click of the :now clock\n\nis like the chime at a buddhist temple,\n\ncalling my soul, my mind,\n\nback to now. 現在是甚麼時候？\n\n跟住我們去那？\n\n剛才我們做了甚麼?\n\n現在先做甲？還是先做乙？\n\n還是做甲途中，同時想乙？\n\n活在當下。\n\n清晰在當下。\n\n將自己凝聚在當下。\n\n當:now 枱鐘咔地一聲，\n\n就像禪堂引磬聲響起，\n\n將心，神呼喚回來。\n\n來到當下一己。"},{"slug":"x021","who":"xsw","title_en":"exception act-itude","title_cn":"","year":2007,"yearText":"2007","category_en":"branding / space","category_cn":"品牌 / 空間","cats":["branding","space"],"cover":"/84000/content/works/x021/00.jpg","imgs":["/84000/content/works/x021/00.jpg","/84000/content/works/x021/01.jpg","/84000/content/works/x021/02.jpg","/84000/content/works/x021/03.jpg"],"client":{"en":"exception de mixmind","cn":"exception de mixmind"},"hay":"exception act-itude 2007 branding / space"},{"slug":"s022","who":"sw","title_en":"tian tian xiang shang","title_cn":"天天向上","year":2013,"yearText":"2013","category_en":"exhibition","category_cn":"展覽","cats":["exhibition"],"cover":"/84000/content/works/s022/00.jpg","imgs":["/84000/content/works/s022/00.jpg","/84000/content/works/s022/01.jpg","/84000/content/works/s022/02.jpg","/84000/content/works/s022/03.jpg"],"client":{"en":"zuni icosahedron","cn":"zuni icosahedron"},"hay":"tian tian xiang shang 天天向上 2013 exhibition can comics serve as a platform for\n\ncollective thinking and collective creativity?\n\ncan comics generate creativity?\n\nlet’s try!\n\ndialoging with oneself can be criticized as\n\na form of self indulgence,\n\nbut i do believe creativity starts with self dialogue,\n\nand dialogue with others is the platform to\n\ninitiate creativity and to generate cross-cultural collaboration.\n\nto have created this programme of creative platform,\n\na project which reflects the creative spirit of hong kong,\n\nbringing out the creativity of various people,\n\nand projecting their collective creativity,\n\nbut most important of all, is the bringing together of\n\ndifferent creative spirits for collaboration.\n\nthis figurine of tian tianis like a piece of blank paper,\n\nhas drawn people closer together,\n\nto work and interact with each other under the same framework, without their realising it.\n\nthey work together to explore the relationship between form and content,\n\ndream and vision, making the most of the spirit of tian tian xiang shang\n\nin which children take fanciful in their imagination and practise experimental learning."},{"slug":"a022","who":"amm","title_en":"queue up china","title_cn":"排隊中國","year":2011,"yearText":"2011","category_en":"multimedia","category_cn":"多媒體","cats":["video","media"],"cover":"/84000/content/works/a022/00.jpg","imgs":["/84000/content/works/a022/00.jpg","/84000/content/works/a022/01.jpg","/84000/content/works/a022/02.jpg","/84000/content/works/a022/03.jpg"],"client":null,"hay":"queue up china 排隊中國 2011 multimedia www.queueupchina.com\n\npush and shove, jostle the way to the front;\n\n elbowing or simply thrusting oneself in… \n\ncutting into line is a familiar sight… \n\nat terminus, cinemas, markets,  \n\neven at occasions where getting ahead is not necessary.  \n\nsmall towns, large metropolis…. \n\nsuch abnormal behavior has become the norm.  \n\nit is a way of life.\n\nthis is not a question of principles\n\n but a problem of disrespect.\n\nthis is not a question of selfishness\n\n but a problem of inconsideration, alienation.\n\nthis is not a question of order\n\n but a problem of lack of discipline.\n\nthis is not a question of being there two minutes earlier \n\nbut a fundamental problem undermining the country’s development  \n\nand growth in the long run. 切入、批肘、攝位、推撞⋯⋯\n\n打尖、 插隊，無處不在⋯⋯ \n\n車站、 戲院、市場， 甚至不用先人一步的場合。 \n\n小城市、大城市⋯⋯ \n\n見怪不怪，或已轉成為理所當然的民生生態。\n\n這不止是原則的問題， \n\n這是尊重的問題。\n\n這不止是自我中心的問題， \n\n這是目中無人的問題。排他的問題。\n\n這不止是生活秩序的問題，\n\n 這是社會序秩的問題。\n\n這不止是快慢兩分鐘的問題，\n\n 這是國家長遠、 結構性的問題。"},{"slug":"x022","who":"xsw","title_en":"now here","title_cn":"當下","year":2007,"yearText":"2007","category_en":"graphic / poster","category_cn":"平面 / 海報","cats":["graphic","poster"],"cover":"/84000/content/works/x022/00.jpg","imgs":["/84000/content/works/x022/00.jpg","/84000/content/works/x022/01.jpg","/84000/content/works/x022/02.jpg","/84000/content/works/x022/03.jpg"],"client":{"en":"exception de mixmind","cn":"exception de mixmind"},"hay":"now here 當下 2007 graphic / poster"},{"slug":"s023","who":"sw","title_en":"ynot","title_cn":"","year":2013,"yearText":"2013","category_en":"graphic / branding / book","category_cn":"平面 / 品牌 / 書籍","cats":["graphic","branding","book"],"cover":"/84000/content/works/s023/00.jpg","imgs":["/84000/content/works/s023/00.jpg","/84000/content/works/s023/01.jpg","/84000/content/works/s023/02.jpg","/84000/content/works/s023/03.jpg"],"client":{"en":"ymo oriental creative development company limited","cn":"ymo oriental creative development company limited"},"hay":"ynot 2013 graphic / branding / book"},{"slug":"a023","who":"amm","title_en":"skylight","title_cn":"天窗","year":2011,"yearText":"2011","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a023/00.jpg","imgs":["/84000/content/works/a023/00.jpg","/84000/content/works/a023/01.jpg","/84000/content/works/a023/02.jpg","/84000/content/works/a023/03.jpg"],"client":null,"hay":"skylight 天窗 2011 installation redwhiteblue turn all windows in the hall into redwhiteblue – latticed windows.\n\ninto a scene of reconstruction.\n\nwritings on the window inspire the viewer\n\nto ponder on the building of a country, of a home.\n\nit all begins with sincerity……\n\nwith trust…… 將展館天窗佈以紅白藍膠布造
