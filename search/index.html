ow they recorded that day? 紀實 \n\n相對是：非紀實 \n\n真相是：沒有絕對的紀實\n\n事實 有時擺在眼前 \n\n事實 有時可製造出來\n\n眼前一片空白⋯⋯ \n\n我還可記得當天的事實? \n\n我還可記得當天 \n\n他們怎樣記載下來?"},{"slug":"x024","who":"xsw","title_en":"life is beautiful / we are under the same sky","title_cn":"","year":2006,"yearText":"2006","category_en":"graphic / book","category_cn":"平面 / 書籍","cats":["graphic","book"],"cover":"/84000/content/works/x024/00.jpg","imgs":["/84000/content/works/x024/00.jpg","/84000/content/works/x024/01.jpg","/84000/content/works/x024/02.jpg","/84000/content/works/x024/03.jpg"],"client":{"en":"exception de mixmind","cn":"exception de mixmind"},"hay":"life is beautiful / we are under the same sky 2006 graphic / book"},{"slug":"s025","who":"sw","title_en":"printing art gallery","title_cn":"印藝廊","year":2012,"yearText":"2012","category_en":"exhibition","category_cn":"展覽","cats":["exhibition"],"cover":"/84000/content/works/s025/00.jpg","imgs":["/84000/content/works/s025/00.jpg","/84000/content/works/s025/01.jpg","/84000/content/works/s025/02.jpg","/84000/content/works/s025/03.jpg"],"client":{"en":"youth square","cn":"youth square"},"hay":"printing art gallery 印藝廊 2012 exhibition printing art gallery bring alive the decades old wai che printing company\n\nwith the presence of the original heidelberg cylinder ks 306434,\n\nworking station of mr. lee chak yue (founder – wai che printing company),\n\nmetal type and the wardrobes tailored made for the metal type\n\nin a brand new setting.\n\nlet’s people learn about the history of letterpress printing.\n\nprinting art gallery displays traditional printing machines\n\nsuch as thermography machine, hand-press printing machine and lead sheet cutter.\n\nmr. lee shared his motto, “never forget, never give up”,\n\nand hoped the younger generation would learn more about\n\nthe history of letterpress printing at the printing art gallery."},{"slug":"a025","who":"amm","title_en":"50 year remain unchanged","title_cn":"五十年在變","year":2010,"yearText":"2010","category_en":"object ontent/works/x026/00.jpg","/84000/content/works/x026/01.jpg"],"client":null,"hay":"octopus / redwhiteblue 八達通 紅白藍 film"},{"slug":"s027","who":"sw","title_en":"the new original / copying china","title_cn":"","year":2012,"yearText":"2012","category_en":"exhibition","category_cn":"展覽","cats":["exhibition"],"cover":"/84000/content/works/s027/00.jpg","imgs":["/84000/content/works/s027/00.jpg","/84000/content/works/s027/01.jpg","/84000/content/works/s027/02.jpg","/84000/content/works/s027/03.jpg"],"client":{"en":"droog","cn":"droog"},"hay":"the new original / copying china 2012 exhibition why produce?\n\nwhy copy?\n\nfrom existence to non existence.\n\nfrom something to another thing.\n\nhow about,\n\nfrom one thing to nothing.\n\nfrom daily to magical.\n\nfrom normal to special.\n\nafter all,\n\nfrom the beginning, there is no matter.\n\nit is an exciting talk about, inspiration for people to experience,\n\nsitting on a chair which is empty and hollow under the piece of cloth.\n\nit needs to the chinese buddhism value of ‘form and emptiness’."},{"slug":"a027","who":"amm","title_en":"painting by god","title_cn":"神畫","year":2010,"yearText":"2010","category_en":"installation / photography","category_cn":"裝置 / 攝影","cats":["installation","photography"],"cover":"/84000/content/works/a027/00.jpg","imgs":["/84000/content/works/a027/00.jpg","/84000/content/works/a027/01.jpg","/84000/content/works/a027/02.jpg","/84000/content/works/a027/03.jpg"],"client":null,"hay":"painting by god 神畫 2010 installation / photography seeing the light,\n\ni believe in divinity.\n\nseeing the land,\n\ni believe in time:\n\nthe past, present, and future.\n\nseeing the wind move,\n\ni believe in the breath and life.\n\nseeing tears of sadness and of gladness,\n\ni believe in the communication of the soul.\n\nbelieving that life is beautiful,\n\ni see the light ahead.\n\ni see, therefore i believe.\n\ni believe, and so i see. 看見光，相信有神。\n\n看見大地，相信時間；昨天今天明天。\n\n看見風動，相信呼吸和生命。\n\n看見哀樂喜怒，相信心靈之溝通。 \n\n相信生命是美麗, 看見前面一道光。\n\n我看見，所以我相信。 \n\n我相信，因此我看見。"},{"slug":"s028","who":"sw","title_en":"uncatalogued: the case of oil street artist village","title_cn":"備案 · 待讀 油街藝術村","year":2012,"yearText":"2012","category_en":"graphic / exhibition / space","category_cn":"平面 / 展覽 / 空間","cats":["graphic","exhibition","space"],"cover":"/84000/content/works/s028/00.jpg","imgs":["/84000/content/works/s028/00.jpg","/84000/content/works/s028/01.jpg","/84000/content/works/s028/02.jpg","/84000/content/works/s028/03.jpg"],"client":{"en":"asia art archive","cn":"asia art archive"},"hay":"uncatalogued: the case of oil street artist village 備案 · 待讀 油街藝術村 2012 graphic / exhibition / space oil street is a history built as much on gaps as on record and nostalgically lives on in the\n\nmemory of the community as an important moment in the city’s cultural development—as an\n\ninstance that allowed artists and organisations to engage in unconstrained experiments with a\n\nlow rent.\n\nuncatalogued the case of oil street artist village\n\n“uncatalogued”: folders with unnamed index tab, informations that haven’t been organized.\n\n“uncatalogued” symbolizes scattered documents, piled up newspaper and photos etc; these\n\n“uncatalogued” information about oil street was gathered and displayed in a 1990s inspired\n\ndata record room.\n\n“uncatalogued” is an exhibition with distinct theme; delicately decorated with furniture used by\n\nartists from oil street, reference books and a timeline on the wall with precious historical\n\nphotos, newspaper and documents. audience are guided by our narrators who walk them\n\nthrough the timeline stated what was going on during the development and decline of oil\n\nstreet. we let audiences to have a different experience, to enjoy a flash back of memory in the\n\nhistory of oil street and hong kong art culture. 香港，2012 年5 月8 日──亞洲藝術文獻庫（下稱「文獻庫」）舉辦《備案‧待讀：油街藝術村》，拼湊出於香港島北角前政府物料供應處油街藝術村的歷史，以及於九十年代尾由一眾藝術家發起的「救油街聯合行動」。展覽將分別於香港國際藝術展裡亞洲藝術文獻庫攤位、以及其位於的荷里活道館址展出，展期至7 月8 日。2006 年，一名香港藝術家在離港前，匆匆的把一個滿載文件的箱子留在亞洲藝術文獻庫。這箱文件一直儲存於文獻庫的特選館藏室，直到2011 年才再被檢視， 關於九十年代後期發生的油街藝術村事件再次浮現。油街藝術村在1998-1999 年間於香港島北角前政府物料供應處冒起，至今仍然為香港藝術界／藝文界所津津樂道。在香港這彈丸之地，該處偌大的空間與低廉的租金可以說是難得一見，藝術家及藝術群體把握機會迅速遷入，在短短18 個月裡把原本的空間改頭換面，變成包含各類媒體的藝術空間和工作室。其後，政府決定收回油街地皮作其他用途，一眾藝術家遂發起「救油街聯合行動」，希望能改變政府初衷，保留油街藝術村，使之持續發展，無奈最終未能如願。對文獻庫而言，這箱資料既是一扇重新詮釋歷史的窗口，也是一次展現歷史研究之複雜性的機緣。文獻庫通過不同方式收集有關油街及油街藝術村的資料和文獻，拼湊出油街地皮（1908 至今）和油街藝術村（1998-2000）發展的平衡時間線，藉此嘗試重構這段佈滿間隙的近代歷史。為了以一個較輕鬆的方式去反映回憶的主觀性，文獻庫將展示一系列重新繪畫的油街版圖，以及邀請了駐紐約藝術家陳佩之及本地故事人雄仔叔叔重新演譯這些資料和文獻。《備案。待讀：油街藝術村》展覽將展示相關的文獻檔案、剪報、書信、插圖和相片等等，並分別於香港國際藝術展裡亞洲藝術文獻庫攤位、以及文獻庫的荷里活道的圖書館展出。"},{"slug":"a028","who":"amm","title_en":"hong kong photographers / two","title_cn":"","year":2009,"yearText":"2009","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a028/00.jpg","imgs":["/84000/content/works/a028/00.jpg","/84000/content/works/a028/01.jpg","/84000/content/works/a028/02.jpg","/84000/content/works/a028/03.jpg"],"client":null,"hay":"hong kong photographers / two 2009 photography"},{"slug":"s029","who":"sw","title_en":"from jean paul sartre to teresa teng: contemporary cantonese art in the 1980s","title_cn":"薩特與鄧麗君：1980年代的廣東當代藝術","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s029/00.jpg","imgs":["/84000/content/works/s029/00.jpg"],"client":{"en":"asia art archive","cn":"asia art archive"},"hay":"from jean paul sartre to teresa teng: contemporary cantonese art in the 1980s 薩特與鄧麗君：1980年代的廣東當代藝術 2011 poster"},{"slug":"a029","who":"amm","title_en":"tomorrow’s daily","title_cn":"明天日報","year":2009,"yearText":"2009","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a029/00.jpg","imgs":["/84000/content/works/a029/00.jpg"],"client":null,"hay":"tomorrow’s daily 明天日報 2009 poster believe, therefore i see\n\nforty years ago, i bravely become a member of the media  and started publishing tomorrow’s daily. people often say to publish a newspaper is like gambling, you can never make money out of it. and they say it is for manipulating and fabricating public opinion.\n\nin 2007, everyone in the city is either reviewing or criticising the “ten years since handover”. i am sure if we have a positive mindset we can always learn a good lesson. for me, how positive is our mindset is exactly an issue,  a “state of hong kong affairs” i am concerned about.\n\ni am delighted to have a group of “journalists” and “critics” accept my invitation to write about the yet-to-happen news of 1 july 2047, that is, the day when one country two system officially will come to an end.\n\nthis group of people included writers, critics, creative minds, even students. they imagined the news with different  points of view, collectively representing how we feel about hong kong, our hopes and expectations…\n\npeople would always say “i see, therefore i believe”, that is how we feel towards hong kong and our chief executive. and when the tides turn, we have to use the power of our mind and say “i see, therefore i believe”,  even to the extent “i believe, therefore i see”.  seriously, isn’t this our philosophy when speculating  in the property and stock markets?\n\nthis is how i started this newspaper, to put together a collective mind to ponder what exactly does  “love hong kong love my country” mean.\n\nin buddhist teachings, this is called karma.\n\nthis is hong kong, in your mind, in your heart.\n\ni wish that seven millions of positive minds will be with me.\n\ni wish that this newspaper will be published every ten years, or perhaps every year. 我相信所以我看見\n\n四十年前的今天，我勇敢地踏足傳媒，辦了份叫《明天日報》的報章。 人們常說辦報是賭博，賺不了錢。 又說辦報是為了控制社會言論和製造及創造社會聲音⋯⋯\n\n在2007年，全城都在回想回歸剛過去的十年，或檢討批評這個 「香港十年」，鬧得熱烘烘的。 無可厚非，用正面積極的平常心一定可以從中溫故知新，從經驗中學習。對我來說，當年的香港正面積極之心有多大就是一個議題，一個我關心的「香港事務」。\n\n幸好得到一班「記者」及「評論人」接受我的邀請，齊齊動筆寫未知的 明天新聞，寫關於2047年7月1日，就是一國兩制正式完結當天的 香港新聞。\n\n這不是一般看來的荒唐無稽，天馬行空的不着邊際。這反而是一個 「瞻前顧後」的學習，對未來的正面和希望的一個反射⋯⋯\n\n特約記者、評論員及編輯隊伍是由二十多位資歷有深有淺的作家、 社會評論專家、非文字創作人、廣告人以至大學、中學生組成。 他們的想像新聞從不同角度，作出一個小小的宏觀，代表了我們對香港的心情，對香港的憧憬和我們對未來的期盼⋯⋯\n\n人們的想法總是「我看見所以我相信」，對人對港對特首對中國如是。 但當時勢不就的當下，「念力」就要派上用場； 「我看見所以我相信」，同時極應做到「我相信所以我看見」。說笑的講，這「我相信所以我看見」不曾就是大家用來炒樓炒股的哲學觀嗎？\n\n當日就是這個信念，開始了這份報紙，叫大家集合眾人的思維，反映 一下每個不同年代的狀況，亦想就此叫大家想一想自身，想一想甚麼是真正的「愛港愛國」。\n\n佛說這叫做業力（karma）。\n\n我們香港的共業在你的手上，你的腦袋裡，你的心中。\n\n願七百多萬個正面積極的念力與我同在。\n\n願這《明天日報》能在每個十年，甚至每年與大家再次見面。"},{"slug":"s030","who":"sw","title_en":"kongcept 2031","title_cn":"","year":2011,"yearText":"2011","category_en":"graphic / exhibition / branding","category_cn":"平面 / 展覽 / 品牌","cats":["graphic","exhibition","branding"],"cover":"/84000/content/works/s030/00.jpg","imgs":["/84000/content/works/s030/00.jpg","/84000/content/works/s030/01.jpg","/84000/content/works/s030/02.jpg","/84000/content/works/s030/03.jpg"],"client":{"en":"hong kong designers association","cn":"hong kong designers association"},"hay":"kongcept 2031 2011 graphic / exhibition / branding"},{"slug":"a030","who":"amm","title_en":"dun huang on the way again","title_cn":"敦煌再上路","year":2008,"yearText":"2008","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a030/00.jpg","imgs":["/84000/content/works/a030/00.jpg","/84000/content/works/a030/01.jpg","/84000/content/works/a030/02.jpg","/84000/content/works/a030/03.jpg"],"client":null,"hay":"dun huang on the way again 敦煌再上路 2008 photography once upon a time,\n\nthis used to be a place of prosperity.\n\nonce upon a time,\n\nthis used to be a place where the east meets the west,\n\nin trade, culture, religion…\n\ntoday,\n\nthis is a place yet to be developed.\n\ntoday,\n\nthis is a cultural treasure being marginalized.\n\na place that once bridged different worlds together,\n\nis now ready to build its own bridge to be on its way again. 曾幾何時，\n\n這是一個興盛的地方，\n\n曾幾何時，\n\n這是東西交會的地方\n\n經濟的、文化的、宗教的……\n\n時至今天，\n\n這是一個待再發展的地方。\n\n時至今天，\n\n這是一個被邊沿的一個文化寶藏。\n\n當日為世界搭橋的地方，\n\n今天正為自身重新搭橋再上路。"},{"slug":"s031","who":"sw","title_en":"one hundred years of chinese railway architecture","title_cn":"中國火車建築一百年","year":2011,"yearText":"2011","category_en":"graphic / exhibition / poster","category_cn":"平面 / 展覽 / 海報","cats":["graphic","exhibition","poster"],"cover":"/84000/content/works/s031/00.jpg","imgs":["/84000/content/works/s031/00.jpg","/84000/content/works/s031/01.jpg","/84000/content/works/s031/02.jpg","/84000/content/works/s031/03.jpg"],"client":{"en":"zuni icosahedron","cn":"zuni icosahedron"},"hay":"one hundred years of chinese railway architecture 中國火車建築一百年 2011 graphic / exhibition / poster"},{"slug":"a031","who":"amm","title_en":"speechless","title_cn":"無言","year":2008,"yearText":"2008","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a031/00.jpg","imgs":["/84000/content/works/a031/00.jpg","/84000/content/works/a031/01.jpg","/84000/content/works/a031/02.jpg","/84000/content/works/a031/03.jpg"],"client":null,"hay":"speechless 無言 2008 photography speaking without any restraints.\n\nyou tear me into pieces… incurable… unpardonable.\n\nyou make me look ridiculous.\n\nthis infuriates me. i in return accuse you of ignorance, full of rubbish.\n\nsilence does not mean that i am mufed or overwhelmed.\n\nunrestrained speeches may just be reckless behaviour,\n\nspeechless is not necessarily without any actions.\n\nsometimes…\n\nwhen all is silent, things will instead reveal themselves. 口無遮欄。\n\n你罵個體無完膚⋯ 無可救藥⋯ 罪無可赦。\n\n迫使面目無光。\n\n換來無名火起。反指你目中無人，語無論次。\n\n默默無言不是啞口無言，\n\n狂言可能是妄為\n\n無言一定不是無為，\n\n有時⋯\n\n萬籟無聲，事情反會無所遁形"},{"slug":"s032","who":"sw","title_en":"one hundred years of solitude 10.0 / cultural revolution","title_cn":"","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s032/00.jpg","imgs":["/84000/content/works/s032/00.jpg"],"client":{"en":"zuni icosahedron","cn":"zuni icosahedron"},"hay":"one hundred years of solitude 10.0 / cultural revolution 2011 poster"},{"slug":"a032","who":"amm","title_en":"kowloon king","title_cn":"九龍皇帝","year":2007,"yearText":"2007","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a032/00.jpg","imgs":["/84000/content/works/a032/00.jpg","/84000/content/works/a032/01.jpg","/84000/content/works/a032/02.jpg","/84000/content/works/a032/03.jpg"],"client":null,"hay":"kowloon king 九龍皇帝 2007 photography"},{"slug":"s033","who":"sw","title_en":"remembrance of karaoke past","title_cn":"唱K回憶錄","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s033/00.jpg","imgs":["/84000/content/works/s033/00.jpg","/84000/content/works/s033/01.jpg"],"client":null,"hay":"remembrance of karaoke past 唱k回憶錄 2011 poster"},{"slug":"a033","who":"amm","title_en":"back to the future / redwhiteblue","title_cn":"回到未來 / 紅白藍","year":2006,"yearText":"2006","category_en":"object","category_cn":"物件","cats":["object","redwhiteblue"],"cover":"/84000/content/works/a033/00.jpg","imgs":["/84000/content/works/a033/00.jpg","/84000/content/works/a033/01.jpg","/84000/content/works/a033/02.jpg"],"client":null,"hay":"back to the future / redwhiteblue 回到未來 / 紅白藍 2006 object redwhiteblue a journey from industry to art & craft.\n\na journey from 21st century to 15th century.\n\na journey from now to future. 一個由工業到文藝之旅程。\n\n一個由廿一到十五世紀之旅程。\n\n一個由現在到未來之旅程。"},{"slug":"s034","who":"sw","title_en":"universiade shenzhen 2011","title_cn":"","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s034/00.jpg","imgs":["/84000/content/works/s034/00.jpg","/84000/content/works/s034/01.jpg","/84000/content/works/s034/02.jpg"],"client":null,"hay":"universiade shenzhen 2011 2011 poster"},{"slug":"a034","who":"amm","title_en":"building hong kong 16 / faith/hope/love","title_cn":"香港建築 16 / 信望愛","year":2006,"yearText":"2006","category_en":"poster / installation / multimedia","category_cn":"海報 / 裝置 / 多媒體","cats":["poster","installation","video","media","redwhiteblue"],"cover":"/84000/content/works/a034/00.jpg","imgs":["/84000/content/works/a034/00.jpg","/84000/content/works/a034/01.jpg","/84000/content/works/a034/02.jpg","/84000/content/works/a034/03.jpg"],"client":null,"hay":"building hong kong 16 / faith/hope/love 香港建築 16 / 信望愛 2006 poster / installation / multimedia redwhiteblue in france, redwhiteblue represents liberty, equality, fraternity.\n\nin thailand, redwhiteblue signifies the country, religion and monarchy.\n\nin the uk and usa it symbolizes fortitude, courage;\n\npeace, integrity, innocence, perseverance and righteousness.\n\nredwhiteblue has been the subject of my photography for 15 years .\n\nfrom its debut in ‘building hong kong’ to being featured in posters and installations\n\non other topics, rwb has travelled far and wide. with this exhibition, it is making its 20th appearance.\n\nfrom hong kong to shenzhen, to london, to venice, to seoul……\n\nrwb has become a part of my life.\n\ni am adamant in using rwb because i see it as the means to convey the positive spirit of hong kong to the world.\n\ni often come across hong kong people who question if there is only rwb\n\nthat can represent hong kong.\n\ni doubt it. we used to have those majestic junks. we now have the dragon,\n\nand more recently, the phoenix…\n\nthe earliest buddhists preached without forms or figures. there were neither temples nor statues. symbols were adopted later on to facilitate easier communications and deeper understanding.\n\nthe qualities exemplified in rwb will continue to evolve without end. persistence, diligence, unity—these and other virtues were saluted in previous works and exhibitions.\n\nin 2000, when pessimism prevailed over hong kong, being as positive as i always was, i launched “building hong kong’. at art museums, shop windows, construction sites i shared my views and expectations with everyone.\n\nduring sars , we witnessed and experienced true comradeship in times of trouble when people were drawn together to fight against adversity. in that period of time, the focus and tone of works such as building hong kong/zou ma kan fa and show flat reflected a mood of anticipation..\n\nin the past two years, the economy has revived and the property market is booming.\n\nironically, the negative sentiments have once again risen…in politics, as in society.\n\ncome. let’s put aside our ego and think for a moment what we really want for hong kong,\n\nour home. what is it that we love? what is there to believe in? and what is there to hope for?\n\nwrite down your thoughts on the wall to share and to inspire.\n\nit is my wish to offer rwb/faith, hope and love as the ultimate quest for everyone in hong kong.\n\nfinally, i hope that whenever we see the familiar redwhiteblue, we will feel, deep in our hearts, the faith, hope and love that we all have for this city. 法國的紅白藍定義爲自由、平等、博愛。\n\n泰國的紅白藍解讀爲國家、宗教和君主制度。\n\n英、美的紅白藍共通象徵堅韌、英勇；\n\n和平、誠信、純潔；不屈不撓和公正。\n\n轉眼間，紅白藍成爲我的攝影題材已經十五年，\n\n將紅白藍作爲「香港建築」或其他課題的平面海報\n\n以致立體裝置，現在已來到第二十次。\n\n由香港出發，到深圳、到倫敦、到威尼斯、到首爾……\n\n它已經成爲我生活的一部份。\n\n堅持紅白藍不爲什麽，就是藉它作爲工具，推銷香港正面的態度吧。\n\n不少香港人問我香港祇有紅白藍嗎？\n\n我想不是吧。我們還有昔日的帆船，今日的飛龍標誌，甚至最近的飛鳳….\n\n最早期佛家弘法，也沒有寺廟和佛像等形相的；\n\n爲方便溝通、接引；具像有時來得方便。\n\n紅白藍的流動沒終點，堅毅，勤勞，參與社群…..等美德性格早在作品或\n\n其他展覽表揚過。\n\n還記得2000年，香港之負面情緒高漲，一向正面的我就開了「香港建築」的課題，\n\n以不同的形式，在美術博物館、商店櫥窗、建築中地盆外牆與大家分享溝通\n\n我對香港人的看法和祈望。\n\nsars之後，我們確實患難見真情；大家同舟共濟，社會聯結起來。\n\n所以那時期的「香港建築」之「走馬看花」和「示範單位」等因而改變了憧憬的調子。\n\n過去兩年間，經濟復興了不少，樓市又大旺起來…\n\n我們的負面情緒和態度又升回高點。政治如是，民生如是….\n\n來。就讓我們每個香港人放下自己一刻鍾，爲香港（我們的家）想一想，\n\n到底我們愛的是甚麽，信的是甚麽，希望的又是甚麽？\n\n將它們寫在牆上給大家一個分享和靈感的空間。\n\n『紅白藍 / 信望愛』就算是我向香港你我他的一份終極祈盼。\n\n最後，謹希望我們每次見到熟悉的紅白藍，都能感受到我們每個人各自內心對香港這都市的信、望、愛。"},{"slug":"s035","who":"sw","title_en":"west kowloon cultural district / a place for everyone","title_cn":"西九 你我文化新天地","year":2011,"yearText":"2011","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s035/00.jpg","imgs":["/84000/content/works/s035/00.jpg","/84000/content/works/s035/01.jpg"],"client":null,"hay":"west kowloon cultural district / a place for everyone 西九 你我文化新天地 2011 poster"},{"slug":"a035","who":"amm","title_en":"life‭. ‬it’s up to you‭.‬","title_cn":"生命。在乎你怎樣看","year":2006,"yearText":"2006","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a035/00.jpg","imgs":["/84000/content/works/a035/00.jpg","/84000/content/works/a035/01.jpg","/84000/content/works/a035/02.jpg","/84000/content/works/a035/03.jpg"],"client":null,"hay":"life‭. ‬it’s up to you‭.‬ 生命。在乎你怎樣看 2006 poster nothing is absolute.\n\neverything is relative.\n\nyou see nowhere.\n\ni see now here. 凡事沒有絕對。\n\n凡事講求相對。\n\n你看的nowhere…\n\n我看見now here…"},{"slug":"s036","who":"sw","title_en":"ink design living","title_cn":"","year":2010,"yearText":"2010","category_en":"graphic / exhibition / book","category_cn":"平面 / 展覽 / 書籍","cats":["graphic","exhibition","book"],"cover":"/84000/content/works/s036/00.jpg","imgs":["/84000/content/works/s036/00.jpg","/84000/content/works/s036/01.jpg","/84000/content/works/s036/02.jpg","/84000/content/works/s036/03.jpg"],"client":{"en":"zuni icosahedron","cn":"zuni icosahedron"},"hay":"ink design living 2010 graphic / exhibition / book"},{"slug":"a036","who":"amm","title_en":"building hong kong 13 / what is the next stop?","title_cn":"","year":2005,"yearText":"2005","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a036/00.jpg","imgs":["/84000/content/works/a036/00.jpg","/84000/content/works/a036/01.jpg"],"client":null,"hay":"building hong kong 13 / what is the next stop? 2005 installation redwhiteblue hongkong architecture. where are we?\n\nhongkong architecture. why are we here?\n\nhongkong architecture. where are we want to go?\n\nhongkong architecture. how to get there?\n\nhongkong architecture. do you think we would get there?\n\nhongkong urban city. where are we?\n\nhongkong urban city. why are we here?\n\nhongkong urban city. where are we want to go?\n\nhongkong urban city. how to get there?\n\nhongkong urban city. do you think we would get there? 香港建築。我哋依家喺邊度？\n\n香港建築。點解我哋喺呢度？\n\n香港建築。我哋想去邊度？\n\n香港建築。點樣去嗰度？\n\n香港建築。你估我哋會唔會去到嗰度？\n\n香港城市。我哋依家喺邊度？\n\n香港城市。點解我哋喺呢度？\n\n香港城市。我哋想去邊度？\n\n香港城市。點樣去嗰度？\n\n香港城市。你估我哋會唔會去到嗰度？"},{"slug":"s037","who":"sw","title_en":"alive / applied laboratory for interactive visualization and embodiment","title_cn":"","year":2010,"yearText":"2010","category_en":"graphic / branding / poster / book","category_cn":"平面 / 品牌 / 海報 / 書籍","cats":["graphic","branding","poster","book"],"cover":"/84000/content/works/s037/00.jpg","imgs":["/84000/content/works/s037/00.jpg","/84000/content/works/s037/01.jpg","/84000/content/works/s037/02.jpg","/84000/content/works/s037/03.jpg"],"client":{"en":"city university of hong kong - school of creative media","cn":"city university of hong kong - school of creative media"},"hay":"alive / applied laboratory for interactive visualization and embodiment 2010 graphic / branding / poster / book"},{"slug":"a037","who":"amm","title_en":"building hong kong 14 / build home with heart","title_cn":"香港建築 14 / 以心建家","year":2005,"yearText":"2005","category_en":"poster","category_cn":"海報","cats":["poster","redwhiteblue"],"cover":"/84000/content/works/a037/00.jpg","imgs":["/84000/content/works/a037/00.jpg","/84000/content/works/a037/01.jpg","/84000/content/works/a037/02.jpg","/84000/content/works/a037/03.jpg"],"client":null,"hay":"building hong kong 14 / build home with heart 香港建築 14 / 以心建家 2005 poster redwhiteblue book festival 2004 featured stanley’s signature redwhiteblue artwork\n\nin an innovative and fress-spirited outdoor setting in order to redefine\n\nthe public space in the surroundings of the hong kong arts centre.\n\nwith the theme city reading, book festival 2004 was the first ever occasion\n\nin hong kong to celebrate the many possibilities of reading in a festive open-air garden where the participants were themselves part of our mobile cityscape.\n\nthe redwhiteblue installation was a collective effort by the artist and\n\nhundreds of art students inspiring participants to read our city with a fresh view."},{"slug":"s038","who":"sw","title_en":"beauty advocate","title_cn":"","year":2010,"yearText":"2010","category_en":"branding","category_cn":"品牌","cats":["branding"],"cover":"/84000/content/works/s038/00.jpg","imgs":["/84000/content/works/s038/00.jpg","/84000/content/works/s038/01.jpg","/84000/content/works/s038/02.jpg","/84000/content/works/s038/03.jpg"],"client":{"en":"beauty advocate","cn":"beauty advocate"},"hay":"beauty advocate 2010 branding"},{"slug":"a038","who":"amm","title_en":"building hong kong 15 / one family one heart","title_cn":"","year":2005,"yearText":"2005","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a038/00.jpg","imgs":["/84000/content/works/a038/00.jpg","/84000/content/works/a038/01.jpg","/84000/content/works/a038/02.jpg"],"client":null,"hay":"building hong kong 15 / one family one heart 2005 installation redwhiteblue hong kong people always use their hearts to tackle the problems\n\nthey face in this city, to build our city. 一棟以中文[心]字作外型的紅白藍大廈。\n\n象徵香港人面對及建築我們的城市；以心對內，以心對外的一個態度。"},{"slug":"s039","who":"sw","title_en":"business of design week 2010","title_cn":"","year":2010,"yearText":"2010","category_en":"branding / space / website","category_cn":"品牌 / 空間 / 網站","cats":["branding","space","media","website"],"cover":"/84000/content/works/s039/00.jpg","imgs":["/84000/content/works/s039/00.jpg","/84000/content/works/s039/01.jpg","/84000/content/works/s039/02.jpg","/84000/content/works/s039/03.jpg"],"client":{"en":"hong kong design centre","cn":"hong kong design centre"},"hay":"business of design week 2010 2010 branding / space / website"},{"slug":"a039","who":"amm","title_en":"investigation of a journey to the west by marco polo: redwhiteblue / tea and chat / venice italy","title_cn":"","year":2005,"yearText":"2005","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a039/00.jpg","imgs":["/84000/content/works/a039/00.jpg","/84000/content/works/a039/01.jpg","/84000/content/works/a039/02.jpg","/84000/content/works/a039/03.jpg"],"client":null,"hay":"investigation of a journey to the west by marco polo: redwhiteblue / tea and chat / venice italy 2005 installation redwhiteblue east and west cultural intercommunication began more than eight hundred years ago,\n\nwhen marco polo came to the east…\n\nevidence 1:\n\nkublai khan trusted the western visitor, marco polo, put his talents to good use,\n\nand maintained an open attitude.\n\nevidence 2:\n\nin his travels, marco polo talks about east asian and chinese cultures\n\nand gives detailed descriptions of places such as dunhuang,\n\nand discoveries such as printing and dynamite.\n\nbut he says nothing about the great wall, calligraphy or tea.\n\ndid people in the yuan dynasty not like tea? didn’t they want marco polo to\n\ntake the art of tea drinking home with him?\n\ndidn’t marco polo care about tea? i shall never know.\n\nbut our art of tea drinking has given me much food for thought.\n\nmore than eight hundred years later, as a chinese,\n\ni appreciate the richness of chinese culture.\n\ni am proud of it and yet i embrace it with an open mind.\n\nnow that my visits to the mainland are more frequent,\n\ni care more about the issues of the country and my home [hong kong]….\n\nassociation 1:\n\nthe world is becoming smaller and smaller with the advancements in transportation\n\nand communication,\n\nand things are now a far cry from the way they were in the days of marco polo.\n\nthe invention of computer interconnection [micro-technology]\n\nhas cut the distance between men to zero.\n\nbut this zero distance has led to an aversion to face-to-face\n\nintercommunication and contact.\n\npeople have become even colder than a computer monitor…\n\nchatting over a cup of tea has become rare and strange.\n\nassociation 2:\n\nour hong kong, our home, since the ’97 handover,\n\nhas become shrouded in an atmosphere of mutual distrust,\n\nnon-communication, and non-consensus….\n\nthis makes me uneasy…\n\nwith the premise that things in hong kong can be improved,\n\nunder the alias of anothermountainman,\n\ni shall try to promote the positive spirit of hong kong in both two\n\nand three-dimensions.\n\nredwhiteblue / tea and chat\n\ni want to re-create a chinese tea-house using red,\n\nwhite and blue to symbolise the spirit of hong kong.\n\neveryone, whether hong kongite, chinese, or italian,\n\nis welcome to sit there and think about the 21st century [the computer age],\n\nintercommunication between men, mutual trust and the attitude of openness. 八百多年前，中西文化交流由馬可孛羅東遊展開…\n\n見証一：\n\n元世祖忽必烈對西方外來人馬可孛羅的信任，用才，開放的態度。\n\n見証二：\n\n東方見聞錄對東亞、中國文化，發明都有詳錄如敦煌、印刷、火藥等⋯\n\n唯獨是對長城、書法和飲茶並未有介紹。\n\n元乾時人們不喜歡飲茶？元乾人不想給馬可孛羅帶走茶藝？\n\n馬可孛羅不重視飲茶？⋯不得而知。中國人飲茶文化倒令我想起很多。\n\n八百多年後今天，身為中國人一份子的我，對中國文化深遠的欣賞，\n\n自豪之餘也帶著活學活用的心態去迎接和面對。\n\n回國回鄉次數越多，令我想起國和家[香港]的話題…\n\n聯想一：\n\n世界之接近因旅遊交通之方便拉得越近，不像馬可孛羅之艱巨。\n\n電腦互聯[mico-technology]的發明，更將人類聯通於零的距離。\n\n但這零距離又將人和人之間介入不重視面對面的溝通和接觸，\n\n人的感情就更甚於冷冷的電腦屏幕⋯\n\n坐下來喝口茶，談談天，談談家事國事的機會變得陌生罕有。\n\n聯想二：\n\n我們的家，我們的香港在回歸後七年間大都在不互信，\n\n不溝通，不傾不講，沒共識的氣氛底下過著活⋯\n\n這是令我覺得最不是味道⋯\n\n在香港可以一定好一些的大前題下，\n\n以又一山人筆名一直在平面立體之不同空間去推銷香港正面精神。\n\n紅白藍 / 飲杯茶．傾過飽\n\n希望以紅白藍作為代表香港和中國的象徵，重現一間中國茶館，\n\n希望將茗茶的文化和藝術帶到西方，讓香港人、中國人、\n\n意大利人以致所有人在茶館坐下來，\n\n想想我們廿一世紀[computer age]；\n\n人與人之間的溝通，真誠的互信和放送態度。"},{"slug":"s040","who":"sw","title_en":"fresh wave 2010 international short film festival","title_cn":"鮮浪潮國際短片展 2010","year":2010,"yearText":"2010","category_en":"graphic / exhibition / branding / poster / book","category_cn":"平面 / 展覽 / 品牌 / 海報 / 書籍","cats":["graphic","exhibition","branding","poster","book"],"cover":"/84000/content/works/s040/00.jpg","imgs":["/84000/content/works/s040/00.jpg","/84000/content/works/s040/01.jpg","/84000/content/works/s040/02.jpg","/84000/content/works/s040/03.jpg"],"client":{"en":"hong kong arts development council","cn":"hong kong arts development council"},"hay":"fresh wave 2010 international short film festival 鮮浪潮國際短片展 2010 2010 graphic / exhibition / branding / poster / book"},{"slug":"a040","who":"amm","title_en":"building hong kong 12 / today’s target done today","title_cn":"香港建築 12 / 今天的事今天做","year":2004,"yearText":"2004","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a040/00.jpg","imgs":["/84000/content/works/a040/00.jpg","/84000/content/works/a040/01.jpg","/84000/content/works/a040/02.jpg","/84000/content/works/a040/03.jpg"],"client":null,"hay":"building hong kong 12 / today’s target done today 香港建築 12 / 今天的事今天做 2004 installation redwhiteblue “yesterday is gone\n\ntomorrow has not yet come\n\nwe only have today\n\nlet us begin”\n\nmother teresa “昨日已是過去，\n\n明天還未有到來。\n\n我們袛得今天，\n\n就讓我們開始吧。”\n\n德蘭修女"},{"slug":"s041","who":"sw","title_en":"happiness is here and now","title_cn":"幸福是此時此地","year":2010,"yearText":"2010","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s041/00.jpg","imgs":["/84000/content/works/s041/00.jpg","/84000/content/works/s041/01.jpg"],"client":{"en":"centre of buddhist studies - hku","cn":"centre of buddhist studies - hku"},"hay":"happiness is here and now 幸福是此時此地 2010 poster"},{"slug":"a041","who":"amm","title_en":"building hong kong redwhiteblue","title_cn":"建：香港精神紅白藍","year":2004,"yearText":"2004","category_en":"poster","category_cn":"海報","cats":["poster","redwhiteblue"],"cover":"/84000/content/works/a041/00.jpg","imgs":["/84000/content/works/a041/00.jpg"],"client":null,"hay":"building hong kong redwhiteblue 建：香港精神紅白藍 2004 poster redwhiteblue"},{"slug":"s042","who":"sw","title_en":"hong kong icon – imaging hong kong","title_cn":"標誌香港","year":2010,"yearText":"2010","category_en":"branding / poster","category_cn":"品牌 / 海報","cats":["branding","poster"],"cover":"/84000/content/works/s042/00.jpg","imgs":["/84000/content/works/s042/00.jpg","/84000/content/works/s042/01.jpg","/84000/content/works/s042/02.jpg","/84000/content/works/s042/03.jpg"],"client":{"en":"the hong kong institute of contemporary culture","cn":"the hong kong institute of contemporary culture"},"hay":"hong kong icon – imaging hong kong 標誌香港 2010 branding / poster"},{"slug":"a042","who":"amm","title_en":"we are the one","title_cn":"香港一定得","year":2004,"yearText":"2004","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a042/00.jpg","imgs":["/84000/content/works/a042/00.jpg","/84000/content/works/a042/01.jpg"],"client":null,"hay":"we are the one 香港一定得 2004 installation redwhiteblue this is not wishful thinking, it is hope…this is not a dead end, but the way out…\n\nborn in the 1960s, i was growing up in an atmosphere of forever ‘taking off’ and going forward’.\n\nindeed, this is a blessing. as the saying goes: ‘what goes up, must come down’.\n\nthere are, as the buddhists say, uncertainties along the path. so if the seven million people in hong kong\n\ndo their best to strive, struggle forward and join together as one face, there will be a better tomorrow.\n\nthis is the reason why, i have been promoting the positive spirit of hong kong\n\nthrough the exhibition series ‘building hong kong redwhiteblue’ over the past three years.\n\nthe 2003 sars epidemic forged and strengthened the community spirit of the people in hong kong.\n\nlet us leave behind the idea of seven million individuals, and join hands to march forward as one.\n\ntoday, under the fioral emblems of celebration, let us hope for the drawing of this heroic day. 不是一派妄想，是一個理想⋯⋯不是一定沒路，是一條出路⋯⋯\n\n六十年代出生的我，一直在「起飛」和「向前」的氣氛下成長，說來也是幸事。\n\n當然，世間有上必有落，佛家有云：無常⋯⋯\n\n當七百萬人各自做好本份，精進，向前，無分你我；我深信香港一定可以好一些。\n\n因此，我過去三年的「香港建築紅白藍系列」一直推銷正面的香港精神。\n\n零三年沙士共患後，香港人的群體心，正面心無疑向前跨了一步。\n\n但願我們放下七百萬個一己，\n\n放下貪念，放下怒氣、憤怨，放下主觀和偏見，\n\n真的攜手往前！\n\n今天，就在花牌底下預祝這一天的來臨吧。"},{"slug":"s043","who":"sw","title_en":"hong kong: creative ecologies / collaboration // pill & pillow","title_cn":"香港:創意生態","year":2010,"yearText":"2010","category_en":"exhibition / branding / poster","category_cn":"展覽 / 品牌 / 海報","cats":["exhibition","branding","poster"],"cover":"/84000/content/works/s043/00.jpg","imgs":["/84000/content/works/s043/00.jpg","/84000/content/works/s043/01.jpg","/84000/content/works/s043/02.jpg","/84000/content/works/s043/03.jpg"],"client":{"en":"hong kong design centre","cn":"hong kong design centre"},"hay":"hong kong: creative ecologies / collaboration // pill & pillow 香港:創意生態 2010 exhibition / branding / poster design for the multi-faceted programme “hong kong: creative ecologies”\n\nthe total solution design campaign including the visual identity system, spatial design and interactive design,\n\nhas demonstrated the energy, style, innovation and branding power mainland china and global audiences.\n\nthe exhibition is a part of the hong kong sar programme for expo 2010 shanghai\n\nand will cover genres form fashion and luxury goods to product and spatial design.\n\nthe theme of the six month long exhibition is to illustrate the assets that\n\nhave powered hong kong from a manufacturing power to a services hub to a creative city\n\nin progress and is a great opportunity to showcase hong kong designers\n\nand design businesses in hope of inspiring the next generation designers. 為「香港：創意生態」展覽而製作的視覺識別系統，空間設計及互動設計，\n\n從多角度向中國內地以至全球人士展示香港設計師的幹勁、風格、創新和品牌力量。\n\n這個展覽是香港特區參與2010年上海世博會的項目之一，內容涵蓋時裝、奢侈品以至產品及空間設計。\n\n展覽為期六個月，主題在於闡述香港如何利用各項元素，從一個製造業基地蛻變成一個服務中心，\n\n進而踏上創意城市發展之路，同時亦是推介本港設計師及設計行業的大好良機，\n\n盼望能為新一代的設計師帶來啟發。"},{"slug":"a043","who":"amm","title_en":"building hong kong 05 / 06 / 07 / 08","title_cn":"香港建築 05 / 06 / 07 / 08","year":2003,"yearText":"2003","category_en":"poster","category_cn":"海報","cats":["poster","redwhiteblue"],"cover":"/84000/content/works/a043/00.jpg","imgs":["/84000/content/works/a043/00.jpg","/84000/content/works/a043/01.jpg","/84000/content/works/a043/02.jpg","/84000/content/works/a043/03.jpg"],"client":null,"hay":"building hong kong 05 / 06 / 07 / 08 香港建築 05 / 06 / 07 / 08 2003 poster redwhiteblue i always say half in jest to people,\n\n“anothermountainman’s cultural posters\n\nare nothing more than a whole lot of my yakking\n\nand lecturing about buddhism…” 常打趣對人說：\n\n又一山人的文化海報？\n\n都是囉囉唆唆，\n\n說說「耶穌」，講講道理，再講講佛吧……"},{"slug":"s044","who":"sw","title_en":"hope & glory: a conceptual circus conceived by simon birch","title_cn":"","year":2010,"yearText":"2010","category_en":"poster / book","category_cn":"海報 / 書籍","cats":["poster","book"],"cover":"/84000/content/works/s044/00.jpg","imgs":["/84000/content/works/s044/00.jpg","/84000/content/works/s044/01.jpg","/84000/content/works/s044/02.jpg","/84000/content/works/s044/03.jpg"],"client":{"en":"the birch foundation","cn":"the birch foundation"},"hay":"hope & glory: a conceptual circus conceived by simon birch 2010 poster / book"},{"slug":"a044","who":"amm","title_en":"building hong kong 09 / show flat","title_cn":"香港建築 09 / 示範單位","year":2003,"yearText":"2003","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a044/00.jpg","imgs":["/84000/content/works/a044/00.jpg","/84000/content/works/a044/01.jpg","/84000/content/works/a044/02.jpg","/84000/content/works/a044/03.jpg"],"client":null,"hay":"building hong kong 09 / show flat 香港建築 09 / 示範單位 2003 installation redwhiteblue visiting model homes,\n\nis believed to be a big past-time in the life of hong kong people,\n\na big event in life.\n\nlet’s build a better tomorrow. 參觀示範單位，\n\n相信是很多香港人生活中一個很大的節目，\n\n生命中一個很大的項目｡\n\n美好的明天，讓我們好好的建築起來｡"},{"slug":"s045","who":"sw","title_en":"archi festival 2009","title_cn":"","year":2009,"yearText":"2009","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s045/00.jpg","imgs":["/84000/content/works/s045/00.jpg"],"client":null,"hay":"archi festival 2009 2009 poster"},{"slug":"a045","who":"amm","title_en":"building hong kong 10 collected from construction sites of 18 districts in hong kong\n\ngather the rise and prosperity of hong kong. 收集自香港十八區興建中地盤的「紅」白藍，\n\n集合了興建中，不斷成長的香港。"},{"slug":"s049","who":"sw","title_en":"business of design week 2009","title_cn":"","year":2009,"yearText":"2009","category_en":"graphic / branding / space / website","category_cn":"平面 / 品牌 / 空間 / 網站","cats":["graphic","branding","space","media","website"],"cover":"/84000/content/works/s049/00.jpg","imgs":["/84000/content/works/s049/00.jpg","/84000/content/works/s049/01.jpg","/84000/content/works/s049/02.jpg","/84000/content/works/s049/03.jpg"],"client":{"en":"hong kong design centre","cn":"hong kong design centre"},"hay":"business of design week 2009 2009 graphic / branding / space / website"},{"slug":"a049","who":"amm","title_en":"building hong kong 03 / redwhiteblue","title_cn":"香港建築 03 / 紅白藍","year":2002,"yearText":"2002","category_en":"poster","category_cn":"海報","cats":["poster","redwhiteblue"],"cover":"/84000/content/works/a049/00.jpg","imgs":["/84000/content/works/a049/00.jpg","/84000/content/works/a049/01.jpg","/84000/content/works/a049/02.jpg","/84000/content/works/a049/03.jpg"],"client":null,"hay":"building hong kong 03 / redwhiteblue 香港建築 03 / 紅白藍 2002 poster redwhiteblue nobody is certain when ʻred, white and blue’first arrived in the world.\n\nnor does anybody know from where\n\nthese colours originated.\n\nwas it from hong kong? china?\n\nor some other parts of the world?\n\nbuilding. a new life, future.\n\nbuilding. a refuge, a home, a sanctuary.\n\nbuilding. position and precision.\n\nbuilding. unity, assemble.\n\nbuilding. is an answer, not a question.\n\nbuilding. optimistic, not by-standing.\n\nbuilding. is in transition; not final.\n\nif hong kong wishes to build, each unit require to take part,\n\npeople hope for hua toi (famous doctor) to save mankind from infection.\n\nmy dream for lu ban (famous carpenter) to be reborn, with his magic axe, to build our home for our country. 不知從何時開始，紅白藍降臨到世間來。\n\n也不知它落到香港先，中國先還是地球另一角先。\n\n建築。是新生，是明天。\n\n建築。是庇蔭，是家，是所。\n\n建築。中正橫豎，準繩，是角力的學問。\n\n建築。是凝聚，不是瓦解。\n\n建築。是一個答案，不是一個問題。\n\n建築。是樂觀，不是旁觀。\n\n建築。是過渡，不是終點。\n\n香港要得建築成，每個單位應承包一份去建築香港……\n\n人總想華陀再世，救活人間。\n\n我只想魯班再活，鬼斧神工，築家建國。"},{"slug":"s050","who":"sw","title_en":"ccdc 2009 annual report","title_cn":"","year":2009,"yearText":"2009","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s050/00.jpg","imgs":["/84000/content/works/s050/00.jpg","/84000/content/works/s050/01.jpg","/84000/content/works/s050/02.jpg","/84000/content/works/s050/03.jpg"],"client":{"en":"city contemporary dance company","cn":"city contemporary dance company"},"hay":"ccdc 2009 annual report 2009 book"},{"slug":"a050","who":"amm","title_en":"building hong kong 04 / public art","title_cn":"香港建築 04 / 公共藝術","year":2002,"yearText":"2002","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a050/00.jpg","imgs":["/84000/content/works/a050/00.jpg","/84000/content/works/a050/01.jpg","/84000/content/works/a050/02.jpg","/84000/content/works/a050/03.jpg"],"client":null,"hay":"building hong kong 04 / public art 香港建築 04 / 公共藝術 2002 installation redwhiteblue i’ve always hoped that cultural and artistic communication\n\ncan go beyond the high-brow gallery and museum spaces\n\nto appear amidst and amongst the public.\n\nthis is the first time the redwhiteblue artworks appear in a public outdoor place.\n\nmy thanks to the owners of the buildings on 102 austin road, tsim sha tsui\n\nfor their generous support. 一向都希望文化藝術的溝通\n\n能突破美術館及博物館這些最高層次的空間，\n\n融匯出現於公眾生活"},{"slug":"s051","who":"sw","title_en":"cheung kong / close to you","title_cn":"長江實業","year":2009,"yearText":"2009","category_en":"tv commercial","category_cn":"電視廣告","cats":["tv commercial","video"],"cover":"/84000/content/works/s051/00.jpg","imgs":["/84000/content/works/s051/00.jpg","/84000/content/works/s051/01.jpg","/84000/content/works/s051/02.jpg"],"client":null,"hay":"cheung kong / close to you 長江實業 2009 tv commercial"},{"slug":"a051","who":"amm","title_en":"building hong kong 01","title_cn":"香港建築 01","year":2001,"yearText":"2001","category_en":"installation","category_cn":"裝置","cats":["installation","redwhiteblue"],"cover":"/84000/content/works/a051/00.jpg","imgs":["/84000/content/works/a051/00.jpg","/84000/content/works/a051/01.jpg","/84000/content/works/a051/02.jpg","/84000/content/works/a051/03.jpg"],"client":null,"hay":"building hong kong 01 香港建築 01 2001 installation redwhiteblue building. a new life, future\n\nbuilding. a refuge, a home, a sanctuary\n\nbuilding. position and precision\n\nbuilding. unity, assemble\n\nbuilding. is an answer, not a question\n\nbuilding. optimistic, not by-standing\n\nbuilding. is in transition; not final\n\nif hong kong wishes to build, each unit require to take part,\n\npeople hope for hua toi (famous doctor) to save mankind from infection\n\nmy dream for lu ban (famous carpenter) to be reborn,\n\nwith his magic axe, to build our home for our country. 建築。是新生，是明天。\n\n建築。是庇蔭，是家，是所。\n\n建築。中正橫豎，準繩，是角力的學問。\n\n建築。是凝聚，不是瓦解。\n\n建築。是一個答案，不是一個問題。\n\n建築。是樂觀，不是旁觀。\n\n建築。是過渡，不是終點。\n\n香港要得建築成，每個單位做得承包一份去建築香港……\n\n人總想華陀再世，救活人間。\n\n我衹想魯班再活，鬼斧神功，築家建國。"},{"slug":"s052","who":"sw","title_en":"constant stream: china 2009","title_cn":"川流不息：解構中國","year":2009,"yearText":"2009","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s052/00.jpg","imgs":["/84000/content/works/s052/00.jpg"],"client":{"en":"royal college of art","cn":"royal college of art"},"hay":"constant stream: china 2009 川流不息：解構中國 2009 poster"},{"slug":"a052","who":"amm","title_en":"the living heritage / redwhiteblue","title_cn":"","year":2001,"yearText":"2001","category_en":"poster","category_cn":"海報","cats":["poster","redwhiteblue"],"cover":"/84000/content/works/a052/00.jpg","imgs":["/84000/content/works/a052/00.jpg","/84000/content/works/a052/01.jpg","/84000/content/works/a052/02.jpg","/84000/content/works/a052/03.jpg"],"client":null,"hay":"the living heritage / redwhiteblue 2001 poster redwhiteblue"},{"slug":"s053","who":"sw","title_en":"fotanian 2009 open studio","title_cn":"","year":2009,"yearText":"2009","category_en":"branding / poster / book","category_cn":"品牌 / 海報 / 書籍","cats":["branding","poster","book"],"cover":"/84000/content/works/s053/00.jpg","imgs":["/84000/content/works/s053/00.jpg","/84000/content/works/s053/01.jpg","/84000/content/works/s053/02.jpg","/84000/content/works/s053/03.jpg"],"client":{"en":"fotanian","cn":"fotanian"},"hay":"fotanian 2009 open studio 2009 branding / poster / book"},{"slug":"a053","who":"amm","title_en":"macau","title_cn":"","year":2000,"yearText":"2000","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a053/00.jpg","imgs":["/84000/content/works/a053/00.jpg"],"client":null,"hay":"macau 2000 poster"},{"slug":"s054","who":"sw","title_en":"heaven king earth queen","title_cn":"皇天后土","year":2009,"yearText":"2009","category_en":"book","category_cn":"書籍","cats":["book"],"cover":"/84000/content/works/s054/00.jpg","imgs":["/84000/content/works/s054/00.jpg","/84000/content/works/s054/01.jpg","/84000/content/works/s054/02.jpg","/84000/content/works/s054/03.jpg"],"client":{"en":"ducky tse chi tak","cn":"ducky tse chi tak"},"hay":"heaven king earth queen 皇天后土 2009 book"},{"slug":"a054","who":"amm","title_en":"no paper","title_cn":"","year":2000,"yearText":"2000","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a054/00.jpg","imgs":["/84000/content/works/a054/00.jpg","/84000/content/works/a054/01.jpg","/84000/content/works/a054/02.jpg","/84000/content/works/a054/03.jpg"],"client":null,"hay":"no paper 2000 poster 過去十年創作旅途中，\n\n被人問了無數千百次的問題： \n\n你這些是設計還是藝術？ \n\n你這些是藝術還是設計？ \n\n你這些「紅白藍」剪剪貼貼是海報嗎？\n\n不錯。 \n\n我沒有意圖去區分設計和藝術之間， \n\n設計可以是藝術。 \n\n藝術可以是設計。\n\n我只會分別甚麼是商業創作；\n\n和甚麼是個人創作。\n\n我甚至十分疲倦關於形式或手段上 \n\n的所謂共識和規限。\n\n創意不是無限的嗎⋯⋯\n\n是次no paper的題目給我探索的 \n\n不止「沒有紙張，不是紙張」這形式上；從沒印刷沒紙張這起點，\n\n借習作嘗試： \n\n沒創意為創意是可能的嗎？\n\n生活上的純粹和經驗可化成意念和靈感嗎？\n\n生活可附於海報？\n\n海報可盛載生活？ \n\n我的答案是：why not！"},{"slug":"s055","who":"sw","title_en":"hong kong repertory theatre / 2009","title_cn":"香港話劇團","year":2009,"yearText":"2009","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/s055/00.jpg","imgs":["/84000/content/works/s055/00.jpg","/84000/content/works/s055/01.jpg","/84000/content/works/s055/02.jpg"],"client":{"en":"hong kong repertory theatre","cn":"hong kong repertory theatre"},"hay":"hong kong repertory theatre / 2009 香港話劇團 2009 poster"},{"slug":"a055","who":"amm","title_en":"superwoman","title_cn":"大女人","year":2000,"yearText":"2000","category_en":"poster","category_cn":"海報","cats":["poster"],"cover":"/84000/content/works/a055/00.jpg","imgs":["/84000/content/works/a055/00.jpg","/84000/content/works/a055/01.jpg","/84000/content/works/a055/02.jpg","/84000/content/works/a055/03.jpg"],"client":null,"hay":"superwoman 大女人 2000 poster throughout the last 60 years, more than anyone else, these 4 women have helped shaped who i am today.\n\nmother teresa: unrelenting sacrifice. undying compassion.\n\neileen chang: insightfully narrating life and living with her words.\n\nrei kawakubo: boldly seeking diversity in the age of conformity.\n\nmy mother lam han: unconditional love. unremitting care. 做了六十年人，影響我很多很多的莫過於這四個偉大女人。\n\n德蘭修女：義無反顧的付出。至死不渝的摯情。\n\n張愛玲：字裡行間閱透世間人情事。\n\n川久保玲：在盲從的世代一份勇於求異的態度。\n\n母親林恨：無量的愛。無止的關懷。"},{"slug":"s056","who":"sw","title_en":"kino 2009","title_cn":"","year":2009,"yearText":"2009","category_en":"branding","category_cn":"品牌","cats":["branding"],"cover":"/84000/content/works/s056/00.jpg","imgs":["/84000/content/works/s056/00.jpg"],"client":null,"hay":"kino 2009 2009 branding"},{"slug":"a056","who":"amm","title_en":"kanzi","title_cn":"看字・漢字","year":1980,"yearText":"1980","category_en":"photography","category_cn":"攝影","cats":["photography"],"cover":"/84000/content/works/a056/00.jpg","imgs":["/84000/content/works/a056/00.jpg","/84000/content/works/a056/01.jpg","/84000/content/works/a056/02.jpg","/84000/content/works/a056/03.jpg"],"client":null,"hay":"kanzi 看字・漢字 1980 photography i’ve immersed myself in creative work in various domains:\n\ncommercial and artistic-cultural;\n\ntwo- and three-dimensional for a quarter of a century now.\n\ni started off specializing in the visual arts,\n\nbut somehow ended up developing an ever more intense interest in the verbal text.\n\nin fact, the main reason why i gave up,\n\nin 1999, my job as creative director of bbh in singapore\n\n[a highly prestigious british advertising agency of international repute],\n\na position i had held for over two years at that point, \n\nand decided to come back to hong kong was because\n\ni missed creating in chinese too much.\n\na picture supposedly tells a thousand words.\n\nso what and how much would one containing a handful of words tell me?\n\nto chinese communities,\n\nthe ideogram is an instrument of communication and a channel for expression.\n\nthrough it, different narrators have different stories to tell, and through time,\n\nthe stories can only grow in vividness and poignancy. 在創作工業裡打轉了三十個年頭。\n\n商業的，文化藝術的，平面的，立體的。\n\n開始就是專長視覺創作的我，不知從何開始，\n\n對文字的興趣及執著愈是濃烈。\n\n還記得一九九九年身在新加坡bbh [世界創意地位崇高英國廣告公司的亞洲分公司]出任創意總監兩年多以來，因為太戀中文創作的原故，\n\n返回香港再與中文續前緣。\n\n人家常談a picture tells more than a thousand words;  \n\n原來一幅照片能說多過千言萬語，\n\n那沒一幅有「三言兩語」的照片可能給我什麼⋯⋯\n\n中文字在我們中國人社會生活中是溝通的工具，表達的渠道，\n\n落在不同人的手中，訴說不同的故事，\n\n與時間磨合發酵，情節愈發立體、動人。"},{"slug":"s057","who":"sw","title_en":"materials of the future: documenting contemporary chinese art from 1980–1990","title_cn":"未來的材料紀錄：1980–1990 中國當代藝術","year":2009,"yearText":"2009","category_en":"exhibition / branding / website","category_cn":"展覽 / 品牌 / 網站","cats":["exhibition","branding","media","website"],"cover":"/84000/content/works/s057/00.jpg","imgs":["/84000/content/works/s057/00.jpg","/84000/content/works/s057/01.jpg","/84000/content/works/s057/02.jpg","/84000/content/works/s057/03.jpg"],"client":{"en":"asia art archive","cn":"asia art archive"},"hay":"materials of the future: documenting contemporary chinese art from 1980–1990 未來的材料紀錄：1980–1990 中國當代藝術 2009 exhibition / branding / website"},{"slug":"a057","who":"amm","title_en":"building hong kong redwhiteblue: lee young ae? you should love!","title_cn":"香港建築紅白藍：李英愛？你應愛！","year":0,"yearText":"","category_en":"","category_cn":"","cats":[],"cover":"/84000/content/works/a057/00.jpg","imgs":["/84000/content/works/a057/00.jpg","/84000/content/works/a057/01.jpg","/84000/content/works/a057/02.jpg","/84000/content/works/a057/03.jpg"],"client":null,"hay":"building hong kong redwhiteblue: lee young ae? you should love! 香港建築紅白藍：李英愛？你應愛！"},{"slug":"s058","who":"sw","title_en":"the forbidden city","title_cn":"大紫禁城","year":2009,"yearText":"2009","category_en":"exhibition / branding / book","category_cn":"展覽 / 品牌 / 書籍","cats":["exhibition","branding","book"],"cover":"/84000/content/works/s058/00.jpg","imgs":["/84000/content/works/s058/00.jpg","/84000/content/works/s058/01.jpg","/84000/content/works/s058/02.jpg","/84000/content/works/s058/03.jpg"],"client":{"en":"zuni icosahedron","cn":"zuni icosahedron"},"hay":"the forbidden city 大紫禁城 2009 exhibition / branding / book a contemporary and educational exhibition of china’s forbidden city held at hong kong’s cultural centre.\n\nthe cultural exhibition was designed to enhance the public’s interest\n\nand knowledge to chinese design culture on the topic of the forbidden city. the use of motion graphics\n\nrecreated space in scale and video experience, engaging the audience, surprise and enlightens them\n\nby combining multimedia technologies and tradition culture.\n\nthe exhibition has attracted audience from all over world\n\nwhich creatively showcases the distinct asian character and lifestyles. 一個富現代和教育意味的大紫禁城展覽於香港交化中心舉行，\n\n展覽旨在加強社會大眾對紫禁城設計交化的興趣和知識。\n\n當中採納的動態圖像營造了大量空間和影片體驗，讓訪客參與其中。\n\n在這揉合多媒體技術和文化的展覽中，為訪客帶來驚喜和啟迪。\n\n展覽吸引了來自世界各地的訪客，\n\n無疑是突顯亞洲風格和生活的絕佳渠道。"},{"slu
